<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0d11">
<title>IB65 V2 — Social Platform</title>
<style>
:root{color-scheme:dark;--bg:#080a0f;--card:#121620;--card2:#191e29;--line:#282e3b;--text:#f7f8fc;--muted:#9da5b5;--red:#ff1744;--purple:#8a2be2;--green:#35d07f}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}button,input,textarea{font:inherit}button{cursor:pointer;border:0;color:inherit}.app{min-height:100vh}.top{position:sticky;top:0;z-index:30;background:rgba(8,10,15,.94);backdrop-filter:blur(16px);border-bottom:1px solid var(--line);height:64px;display:flex;align-items:center;gap:16px;padding:0 18px}.brand{display:flex;align-items:center;gap:9px;font-weight:950;font-size:24px;letter-spacing:-1px}.logo{width:38px;height:38px;border-radius:12px;padding:2px;background:linear-gradient(135deg,var(--red),var(--purple));display:grid;place-items:center}.logo b{width:100%;height:100%;border-radius:10px;background:var(--bg);display:grid;place-items:center;font-size:15px}.search{flex:1;max-width:550px;margin:auto;position:relative}.search input{width:100%;background:var(--card);border:1px solid var(--line);color:var(--text);border-radius:99px;padding:11px 16px 11px 42px;outline:none}.search input:focus{border-color:#5a6070}.search span{position:absolute;left:15px;top:8px;color:var(--muted);font-size:20px}.actions{display:flex;gap:8px}.pill,.icon{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 13px}.primary{background:linear-gradient(100deg,var(--red),var(--purple));border-radius:12px;padding:10px 15px;font-weight:850}.layout{max-width:1220px;margin:auto;display:grid;grid-template-columns:210px minmax(0,650px) 270px;gap:22px;padding:22px 16px 95px}.side{position:sticky;top:86px;height:max-content}.nav button{width:100%;background:transparent;text-align:left;padding:12px;border-radius:12px;color:var(--muted);margin-bottom:4px}.nav button.active,.nav button:hover{background:var(--card);color:var(--text)}.card{background:var(--card);border:1px solid var(--line);border-radius:18px}.composer{padding:15px;margin-bottom:14px}.row{display:flex;align-items:center;gap:10px}.avatar{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,#ff6b8a,#8a2be2);display:grid;place-items:center;font-weight:900;flex:0 0 auto}.composer input{flex:1;background:var(--card2);border:1px solid var(--line);border-radius:99px;padding:11px 15px;color:var(--text)}.composer-tools{display:flex;gap:8px;margin-top:12px}.tool{background:var(--card2);padding:9px 12px;border-radius:10px;color:var(--muted)}.post{padding:16px;margin-bottom:14px}.post-head{display:flex;align-items:center;justify-content:space-between}.user{display:flex;align-items:center;gap:10px}.name{font-weight:850}.handle{font-size:12px;color:var(--muted)}.follow{background:transparent;border:1px solid var(--line);padding:7px 11px;border-radius:9px;color:#ddd}.following{background:var(--card2);color:#fff}.post p{line-height:1.55;color:#e5e8ef;white-space:pre-wrap}.media{height:330px;border-radius:15px;background:radial-gradient(circle at 25% 20%,#ff1744 0,transparent 30%),radial-gradient(circle at 75% 75%,#8a2be2 0,transparent 35%),linear-gradient(135deg,#181c28,#08090c);display:grid;place-items:center;font-size:48px;font-weight:1000;letter-spacing:-3px;margin:12px 0}.post-actions{display:flex;gap:4px;border-top:1px solid var(--line);padding-top:10px}.post-actions button{background:transparent;color:var(--muted);padding:8px 10px;border-radius:9px}.post-actions button:hover{background:var(--card2);color:var(--text)}.liked{color:#ff4267!important}.saved{color:#f3c84b!important}.comments{margin-top:12px;border-top:1px solid var(--line);padding-top:10px}.comment{display:flex;gap:8px;padding:8px 0}.comment .avatar{width:30px;height:30px;font-size:12px}.comment-body{background:var(--card2);border-radius:12px;padding:8px 10px;flex:1}.comment-input{display:flex;gap:7px;margin-top:8px}.comment-input input{flex:1;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:9px;color:var(--text)}.right .card{padding:15px;margin-bottom:14px}.trend{padding:10px 0;border-bottom:1px solid var(--line)}.trend:last-child{border:0}.small{font-size:12px;color:var(--muted)}.profile-card{text-align:center;padding:20px}.profile-card .avatar{width:74px;height:74px;margin:0 auto 10px;font-size:25px}.stats{display:flex;justify-content:space-around;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:12px 0;margin:15px 0}.stat b{display:block}.stat span{font-size:12px;color:var(--muted)}.bottom{display:none}.modal{position:fixed;inset:0;background:rgba(0,0,0,.74);display:none;place-items:center;z-index:60;padding:18px}.modal.show{display:grid}.modal-box{width:min(540px,100%);max-height:90vh;overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px}.modal textarea{width:100%;min-height:130px;resize:vertical;background:var(--card2);border:1px solid var(--line);color:var(--text);border-radius:13px;padding:12px;outline:none;margin:14px 0}.modal input{width:100%;background:var(--card2);border:1px solid var(--line);color:var(--text);border-radius:11px;padding:11px;margin:7px 0;outline:none}.modal-actions{display:flex;justify-content:flex-end;gap:8px}.tabs{display:flex;border-bottom:1px solid var(--line);margin:0 -18px 14px}.tabs button{flex:1;background:transparent;padding:12px;color:var(--muted);border-bottom:2px solid transparent}.tabs button.active{color:#fff;border-color:var(--red)}.notice{padding:11px 12px;border:1px solid #3b4150;border-radius:12px;background:var(--card2);font-size:13px;color:#dfe3eb;margin:10px 0}.toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%) translateY(20px);opacity:0;background:#fff;color:#111;padding:10px 16px;border-radius:99px;font-weight:750;transition:.25s;z-index:90}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}.hidden{display:none!important}@media(max-width:920px){.layout{grid-template-columns:1fr;max-width:700px}.side,.right{display:none}.top{padding:0 12px}.search{display:block}.bottom{position:fixed;bottom:0;left:0;right:0;z-index:40;display:flex;justify-content:space-around;background:rgba(8,10,15,.97);border-top:1px solid var(--line);padding:8px}.bottom button{background:transparent;color:var(--muted);padding:5px 12px}.bottom button.active{color:#fff}.actions .pill{display:none}}@media(max-width:560px){.brand span{display:none}.top{gap:8px}.search{max-width:none}.primary{padding:10px 11px}.layout{padding:12px 9px 82px}.media{height:250px}.composer-tools .tool:nth-child(n+3){display:none}.post-actions button{padding:8px 7px;font-size:13px}}
</style></head>
<body><div class="app">
<header class="top"><div class="brand"><div class="logo"><b>IB</b></div><span>IB65</span></div><div class="search"><span>⌕</span><input id="search" placeholder="Search creators, posts..." oninput="renderFeed()"></div><div class="actions"><button class="pill" onclick="openNotifications()">🔔 <span id="notifCount"></span></button><button class="primary" onclick="openCreate()">＋ Create</button></div></header>
<div class="layout">
<aside class="side"><nav class="nav"><button class="active" onclick="navigate(this,'Home')">⌂ &nbsp; Home</button><button onclick="navigate(this,'Explore')">◉ &nbsp; Explore</button><button onclick="navigate(this,'Reels')">▶ &nbsp; Reels</button><button onclick="navigate(this,'Messages')">✉ &nbsp; Messages</button><button onclick="openProfile()">● &nbsp; Profile</button></nav></aside>
<main>
<section class="card composer"><div class="row"><div class="avatar" id="composerAvatar">M</div><input readonly onclick="openCreate()" placeholder="What's happening on IB65?"></div><div class="composer-tools"><button class="tool" onclick="openCreate()">🖼 Photo</button><button class="tool" onclick="openCreate()">🎬 Video</button><button class="tool" onclick="openCreate()">😊 Feeling</button></div></section>
<div id="feed"></div></main>
<aside class="right"><div id="profileCard" class="card profile-card"></div><div class="card"><h3 style="margin:0 0 8px">Trending on IB65</h3><div class="trend"><b>#IB65</b><div class="small">12.4K posts</div></div><div class="trend"><b>#Creators</b><div class="small">8.7K posts</div></div><div class="trend"><b>#India</b><div class="small">6.1K posts</div></div><div class="trend"><b>#Reels</b><div class="small">4.8K posts</div></div></div><div class="card"><h3 style="margin-top:0">Suggested creators</h3><div id="suggestions"></div></div></aside>
</div><nav class="bottom"><button class="active" onclick="navigate(this,'Home')">⌂<br><small>Home</small></button><button onclick="navigate(this,'Explore')">◉<br><small>Explore</small></button><button onclick="openCreate()">＋<br><small>Create</small></button><button onclick="navigate(this,'Reels')">▶<br><small>Reels</small></button><button onclick="openProfile()">●<br><small>Profile</small></button></nav></div>

<div class="modal" id="modal" onclick="if(event.target===this)closeModal()"><div class="modal-box" id="modalBox"></div></div><div class="toast" id="toast"></div>
<script>
const KEY='ib65_v2_state';
const defaultState={user:{name:'Manish',handle:'@manish',initial:'M',bio:'Building IB65 🚀',followers:128,following:64},following:['@arjun'],saved:[],notifications:[{text:'Welcome to IB65 V2! Your activity will appear here.',time:'Now'}],posts:[
{id:1,user:'Manish',handle:'@manish',initial:'M',text:'IB65 का नया V2 look कैसा लग रहा है? 🚀',likes:128,comments:[{user:'Riya',initial:'R',text:'बहुत बढ़िया! 🔥'}],liked:false},
{id:2,user:'Aarav',handle:'@aarav',initial:'A',text:'आज का creator tip: छोटी शुरुआत करो, लेकिन लगातार बनाते रहो।',likes:94,comments:[{user:'Manish',initial:'M',text:'सही बात!'}],liked:false},
{id:3,user:'Riya',handle:'@riya',initial:'R',text:'Reels और short videos के लिए नया idea तैयार है! 🎬',likes:207,comments:[],liked:false}],creators:[{name:'Arjun',handle:'@arjun',initial:'A'},{name:'Riya',handle:'@riya',initial:'R'},{name:'Aarav',handle:'@aarav',initial:'A'}]};
let state=load();
function load(){try{return {...defaultState,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch(e){return defaultState}}
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function esc(s){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function render(){renderFeed();renderProfileCard();renderSuggestions();document.getElementById('composerAvatar').textContent=state.user.initial;document.getElementById('notifCount').textContent=state.notifications.length?`(${state.notifications.length})`:''}
function renderFeed(){const q=document.getElementById('search').value.toLowerCase();const f=state.posts.filter(p=>(p.text+p.user+p.handle).toLowerCase().includes(q));document.getElementById('feed').innerHTML=f.map(p=>postHTML(p)).join('')||'<div class="card" style="padding:30px;text-align:center;color:var(--muted)">No posts found</div>'}
function postHTML(p){const isSaved=state.saved.includes(p.id);return `<article class="card post"><div class="post-head"><div class="user"><div class="avatar">${esc(p.initial)}</div><div><div class="name">${esc(p.user)}</div><div class="handle">${esc(p.handle)} · 2h</div></div></div>${p.handle!==state.user.handle?`<button class="follow ${state.following.includes(p.handle)?'following':''}" onclick="toggleFollow('${p.handle}',this)">${state.following.includes(p.handle)?'Following':'Follow'}</button>`:'<button class="icon" onclick="openProfile()">•••</button>'}</div><p>${esc(p.text)}</p><div class="media">IB65</div><div class="post-actions"><button class="${p.liked?'liked':''}" onclick="like(${p.id})">♥ ${p.likes}</button><button onclick="toggleComments(${p.id})">💬 ${p.comments.length}</button><button onclick="sharePost(${p.id})">↗ Share</button><button class="${isSaved?'saved':''}" onclick="toggleSave(${p.id})">🔖</button></div><div id="comments-${p.id}" class="comments hidden"><div>${p.comments.map(c=>`<div class="comment"><div class="avatar">${esc(c.initial)}</div><div class="comment-body"><b>${esc(c.user)}</b><div>${esc(c.text)}</div></div></div>`).join('')}</div><div class="comment-input"><input id="comment-${p.id}" placeholder="Write a comment..." onkeydown="if(event.key==='Enter')addComment(${p.id})"><button class="primary" onclick="addComment(${p.id})">Send</button></div></div></article>`}
function like(id){const p=state.posts.find(x=>x.id===id);p.liked=!p.liked;p.likes+=p.liked?1:-1;if(p.liked&&p.handle!==state.user.handle)state.notifications.unshift({text:`${p.user} को आपका like पसंद आया।`,time:'Just now'});save();render()}
function toggleSave(id){const i=state.saved.indexOf(id);if(i>=0)state.saved.splice(i,1);else state.saved.push(id);save();render();toast(i>=0?'Removed from saved':'Saved ✓')}
function toggleComments(id){const e=document.getElementById('comments-'+id);e.classList.toggle('hidden')}
function addComment(id){const input=document.getElementById('comment-'+id);const t=input.value.trim();if(!t)return;const p=state.posts.find(x=>x.id===id);p.comments.push({user:state.user.name,initial:state.user.initial,text:t});if(p.handle!==state.user.handle)state.notifications.unshift({text:`आपने ${p.user} के post पर comment किया।`,time:'Just now'});input.value='';save();render();setTimeout(()=>document.getElementById('comments-'+id)?.classList.remove('hidden'),0)}
function toggleFollow(handle,b){const i=state.following.indexOf(handle);if(i>=0){state.following.splice(i,1);state.user.followers=Math.max(0,state.user.followers-1);b.textContent='Follow';b.classList.remove('following')}else{state.following.push(handle);state.user.followers++;b.textContent='Following';b.classList.add('following');state.notifications.unshift({text:`अब आप ${handle} को follow कर रहे हैं।`,time:'Just now'})}save();renderProfileCard();renderSuggestions()}
function sharePost(id){navigator.clipboard?.writeText(location.href+'#post-'+id).catch(()=>{});toast('Post link copied ✓')}
function renderProfileCard(){document.getElementById('profileCard').innerHTML=`<div class="avatar">${esc(state.user.initial)}</div><h3 style="margin:4px 0">${esc(state.user.name)}</h3><div class="small">${esc(state.user.handle)}</div><p class="small">${esc(state.user.bio)}</p><div class="stats"><div class="stat"><b>${state.posts.filter(p=>p.handle===state.user.handle).length}</b><span>Posts</span></div><div class="stat"><b>${state.user.followers}</b><span>Followers</span></div><div class="stat"><b>${state.user.following}</b><span>Following</span></div></div><button class="pill" onclick="openProfile()">View profile</button>`}
function renderSuggestions(){document.getElementById('suggestions').innerHTML=state.creators.filter(c=>c.handle!==state.user.handle).map(c=>`<div class="row" style="margin:12px 0"><div class="avatar">${c.initial}</div><div style="flex:1"><b>${c.name}</b><div class="small">${c.handle}</div></div><button class="follow ${state.following.includes(c.handle)?'following':''}" onclick="toggleFollow('${c.handle}',this)">${state.following.includes(c.handle)?'Following':'Follow'}</button></div>`).join('')}
function openCreate(){openModal(`<div class="row" style="justify-content:space-between"><h2 style="margin:0">Create post</h2><button class="icon" onclick="closeModal()">✕</button></div><div class="notice">Photo/video upload UI is ready. Real file storage will be connected to the backend in the next step.</div><textarea id="postText" placeholder="Share something with IB65..."></textarea><div class="modal-actions"><button class="pill" onclick="closeModal()">Cancel</button><button class="primary" onclick="createPost()">Publish</button></div>`);setTimeout(()=>document.getElementById('postText').focus(),30)}
function createPost(){const t=document.getElementById('postText').value.trim();if(!t)return toast('Post में कुछ लिखें');state.posts.unshift({id:Date.now(),user:state.user.name,handle:state.user.handle,initial:state.user.initial,text:t,likes:0,comments:[],liked:false});save();closeModal();render();toast('Post published ✓')}
function openProfile(){openModal(`<div class="row" style="justify-content:space-between"><h2 style="margin:0">My Profile</h2><button class="icon" onclick="closeModal()">✕</button></div><div class="profile-card" style="background:transparent;border:0"><div class="avatar">${esc(state.user.initial)}</div><h2>${esc(state.user.name)}</h2><div class="small">${esc(state.user.handle)}</div><p>${esc(state.user.bio)}</p><div class="stats"><div class="stat"><b>${state.posts.filter(p=>p.handle===state.user.handle).length}</b><span>Posts</span></div><div class="stat"><b>${state.user.followers}</b><span>Followers</span></div><div class="stat"><b>${state.user.following}</b><span>Following</span></div></div><button class="primary" onclick="openEditProfile()">Edit profile</button></div>`)}
function openEditProfile(){openModal(`<div class="row" style="justify-content:space-between"><h2 style="margin:0">Edit profile</h2><button class="icon" onclick="closeModal()">✕</button></div><label>Name</label><input id="editName" value="${esc(state.user.name)}"><label>Username</label><input id="editHandle" value="${esc(state.user.handle)}"><label>Bio</label><input id="editBio" value="${esc(state.user.bio)}"><div class="modal-actions"><button class="pill" onclick="openProfile()">Cancel</button><button class="primary" onclick="saveProfile()">Save</button></div>`)}
function saveProfile(){const n=document.getElementById('editName').value.trim()||state.user.name;const h=document.getElementById('editHandle').value.trim().startsWith('@')?document.getElementById('editHandle').value.trim():'@'+document.getElementById('editHandle').value.trim();state.user.name=n;state.user.handle=h;state.user.initial=n.charAt(0).toUpperCase();state.user.bio=document.getElementById('editBio').value.trim();state.posts.forEach(p=>{if(p.handle===state.user.handle||p.user==='Manish') {p.user=state.user.name;p.handle=state.user.handle;p.initial=state.user.initial}});save();render();openProfile();toast('Profile updated ✓')}
function openNotifications(){openModal(`<div class="row" style="justify-content:space-between"><h2 style="margin:0">Notifications</h2><button class="icon" onclick="closeModal()">✕</button></div>${state.notifications.length?state.notifications.map(n=>`<div class="notice">🔔 ${esc(n.text)}<div class="small">${esc(n.time)}</div></div>`).join(''):'<p class="small">No notifications yet.</p>'}<div class="modal-actions"><button class="pill" onclick="state.notifications=[];save();render();closeModal()">Mark all read</button></div>`)}
function openModal(html){document.getElementById('modalBox').innerHTML=html;document.getElementById('modal').classList.add('show')};function closeModal(){document.getElementById('modal').classList.remove('show')}
function navigate(b,name){document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');if(name==='Home'){document.getElementById('search').value='';renderFeed();return}if(name==='Explore'){document.getElementById('search').focus();toast('Explore: search creators और posts')}else if(name==='Reels'){toast('Reels module — backend media आने पर connect होगा')}else if(name==='Messages'){toast('Messages module — next backend phase')} }
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.add('show');clearTimeout(window.tt);window.tt=setTimeout(()=>e.classList.remove('show'),1900)}
render();
</script></body></html>
