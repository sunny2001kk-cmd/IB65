<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IB65 — Social Platform</title>
    <link rel="manifest" href="manifest.json">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #0b0e14; color: #f3f4f6; }
        .icon-3d {
            filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.4)) drop-shadow(0 1px 3px rgba(225, 48, 108, 0.5));
            transition: transform 0.2s ease, filter 0.2s ease;
        }
        .icon-3d:active { transform: scale(0.85); }
        .glass-card { background: rgba(17, 24, 39, 0.85); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
    </style>
</head>
<body class="min-h-screen pb-20">

    <!-- Top Header Title (Instagram Style & Settings) -->
    <header class="sticky top-0 z-40 glass-card border-b border-gray-800 px-4 py-3 flex justify-between items-center shadow-lg">
        <div class="flex items-center space-x-2">
            <h1 class="text-2xl font-extrabold bg-gradient-to-r from-amber-500 via-rose-500 to-purple-600 bg-clip-text text-transparent tracking-wider">IB65</h1>
        </div>
        <div class="flex items-center space-x-4">
            <button onclick="switchTab('profile')" class="text-gray-300 hover:text-rose-500 icon-3d text-xl"><i class="fa-solid fa-gear"></i></button>
            <div id="header-user-avatar" class="w-9 h-9 rounded-full bg-gradient-to-tr from-amber-500 to-rose-600 flex items-center justify-center font-bold text-white text-sm shadow-md cursor-pointer" onclick="switchTab('profile')">U</div>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="max-w-xl mx-auto p-4 space-y-4">
        
        <!-- SEARCH BAR (Global for Users & Posts) -->
        <div class="relative">
            <i class="fa-solid fa-search absolute left-4 top-3.5 text-gray-500"></i>
            <input type="text" id="global-search" placeholder="Search users, posts or videos..." oninput="globalSearch()" class="w-full glass-card rounded-xl pl-11 pr-4 py-3 text-sm text-gray-200 placeholder-gray-500 focus:outline-none focus:border-rose-500 shadow-inner">
        </div>

        <!-- HOME VIEW -->
        <div id="view-home" class="space-y-4">
            <!-- Create Post Box -->
            <section class="glass-card rounded-2xl p-4 shadow-xl">
                <div class="flex space-x-3">
                    <div class="w-10 h-10 rounded-full bg-gradient-to-tr from-amber-500 to-rose-600 flex items-center justify-center font-bold text-white shadow-md" id="user-initial">U</div>
                    <div class="flex-1">
                        <textarea id="post-text" rows="2" placeholder="What's on your mind?" class="w-full bg-transparent text-gray-100 placeholder-gray-500 focus:outline-none resize-none text-sm"></textarea>
                        
                        <!-- Media Preview -->
                        <div id="media-preview-container" class="relative mt-2 hidden">
                            <img id="image-preview" class="rounded-xl max-h-48 w-full object-cover hidden shadow-md">
                            <video id="video-preview" class="rounded-xl max-h-48 w-full object-cover hidden shadow-md" controls></video>
                            <button onclick="removeMedia()" class="absolute top-2 right-2 bg-black/70 text-white rounded-full p-1 px-2 text-xs hover:bg-red-600 transition"><i class="fa-solid fa-xmark"></i> Remove</button>
                        </div>

                        <div class="flex justify-between items-center mt-3 pt-3 border-t border-gray-800">
                            <div class="flex space-x-4">
                                <label class="cursor-pointer text-rose-500 hover:text-rose-400 icon-3d flex items-center space-x-1 text-sm font-medium" title="Upload Image">
                                    <i class="fa-solid fa-image text-xl"></i>
                                    <input type="file" id="media-file-img" accept="image/*" class="hidden" onchange="handleMediaSelect(event, 'image')">
                                </label>
                                <label class="cursor-pointer text-amber-500 hover:text-amber-400 icon-3d flex items-center space-x-1 text-sm font-medium" title="Upload Video">
                                    <i class="fa-solid fa-video text-xl"></i>
                                    <input type="file" id="media-file-vid" accept="video/*" class="hidden" onchange="handleMediaSelect(event, 'video')">
                                </label>
                            </div>
                            <button onclick="createPost()" class="bg-gradient-to-r from-amber-500 via-rose-500 to-purple-600 text-white font-semibold px-5 py-2 rounded-xl text-sm shadow-lg shadow-rose-500/30 hover:opacity-90 transition icon-3d">Post</button>
                        </div>
                    </div>
                </div>
            </section>

            <!-- Posts Feed -->
            <div id="posts-container" class="space-y-4">
                <div class="text-center text-gray-500 py-8">Loading posts...</div>
            </div>
        </div>

        <!-- REELS VIEW -->
        <div id="view-reels" class="space-y-4 hidden">
            <div class="glass-card rounded-2xl p-5 text-center space-y-4 shadow-xl">
                <div class="flex justify-between items-center border-b border-gray-800 pb-3">
                    <div class="flex items-center space-x-2 text-rose-500">
                        <i class="fa-solid fa-clapperboard text-xl"></i>
                        <h2 class="text-lg font-bold text-gray-100">IB65 Reels</h2>
                    </div>
                    <label class="cursor-pointer bg-gradient-to-r from-amber-500 via-rose-500 to-purple-600 text-white text-xs font-semibold px-3 py-2 rounded-xl shadow-md icon-3d flex items-center space-x-1">
                        <i class="fa-solid fa-plus"></i>
                        <span>Upload Reel</span>
                        <input type="file" accept="video/*" class="hidden" onchange="handleReelUpload(event)">
                    </label>
                </div>
                <p class="text-xs text-gray-400">Short vertical videos feed</p>
            </div>

            <!-- Reels Feed -->
            <div id="reels-container" class="space-y-4">
                <div class="text-center text-gray-500 py-8">No reels yet. Upload one!</div>
            </div>
        </div>

        <!-- CHAT VIEW (Instagram DM Style) -->
        <div id="view-chat" class="space-y-4 hidden">
            <div class="glass-card rounded-2xl p-4 space-y-3 shadow-xl">
                <div class="flex justify-between items-center border-b border-gray-800 pb-2">
                    <h2 class="font-bold text-base">Messages</h2>
                    <span class="text-xs text-rose-400 font-medium">Direct</span>
                </div>
                <!-- Chat List / Box -->
                <div id="chat-messages-container" class="space-y-3 max-h-72 overflow-y-auto p-2">
                    <div class="text-center text-gray-500 text-xs py-4">No messages yet. Start a conversation!</div>
                </div>
                <!-- Send Message Bar -->
                <div class="flex space-x-2 pt-2 border-t border-gray-800">
                    <input type="text" id="chat-input" placeholder="Message..." class="flex-1 bg-gray-900/60 border border-gray-700 rounded-xl px-4 py-2 text-sm text-gray-100 placeholder-gray-500 focus:outline-none focus:border-rose-500">
                    <button onclick="sendChatMessage()" class="bg-gradient-to-r from-amber-500 to-rose-600 text-white px-4 py-2 rounded-xl text-sm font-semibold shadow-md icon-3d"><i class="fa-solid fa-paper-plane"></i></button>
                </div>
            </div>
        </div>

        <!-- PROFILE VIEW (Instagram Style Grid & Edit) -->
        <div id="view-profile" class="space-y-4 hidden">
            <div class="glass-card rounded-2xl p-6 text-center space-y-4 shadow-xl">
                <div class="w-20 h-20 mx-auto rounded-full bg-gradient-to-tr from-amber-500 via-rose-500 to-purple-600 flex items-center justify-center font-extrabold text-2xl text-white shadow-xl" id="profile-initial">U</div>
                <div>
                    <h2 id="profile-name" class="text-xl font-bold">User Name</h2>
                    <p id="profile-email" class="text-xs text-gray-400">user@email.com</p>
                </div>
                
                <!-- Edit Profile Toggle -->
                <div class="flex justify-center space-x-2">
                    <button onclick="toggleEditProfile()" class="bg-gray-800 hover:bg-gray-700 text-gray-200 font-semibold px-4 py-1.5 rounded-xl text-xs transition icon-3d">Edit Profile</button>
                    <button onclick="handleLogout()" class="bg-red-600/80 hover:bg-red-600 text-white font-semibold px-4 py-1.5 rounded-xl text-xs transition shadow-lg icon-3d">Logout</button>
                </div>

                <!-- Edit Profile Box (Hidden by default) -->
                <div id="edit-profile-box" class="hidden space-y-3 pt-3 border-t border-gray-800 text-left">
                    <input type="text" id="edit-name-input" placeholder="New Name" class="w-full bg-gray-900/60 border border-gray-700 rounded-xl px-3 py-2 text-sm text-gray-100">
                    <button onclick="saveProfile()" class="w-full bg-gradient-to-r from-amber-500 to-rose-600 text-white font-semibold py-2 rounded-xl text-xs shadow-md">Save Changes</button>
                </div>
            </div>

            <!-- User's Posts & Videos Grid (Instagram Profile Style) -->
            <div class="glass-card rounded-2xl p-4 space-y-3 shadow-xl">
                <h3 class="font-bold text-sm text-gray-300 border-b border-gray-800 pb-2">My Posts & Videos</h3>
                <div id="my-posts-grid" class="grid grid-cols-2 gap-3">
                    <div class="text-center text-gray-500 col-span-2 py-4 text-xs">No posts yet</div>
                </div>
            </div>
        </div>

    </main>

    <!-- Bottom Navigation Bar (3D Icons) -->
    <nav class="fixed bottom-0 left-0 right-0 glass-card border-t border-gray-800 py-3 px-6 flex justify-around items-center z-50 shadow-2xl">
        <button onclick="switchTab('home')" id="nav-home" class="text-rose-500 icon-3d flex flex-col items-center"><i class="fa-solid fa-house text-xl"></i></button>
        <button onclick="switchTab('reels')" id="nav-reels" class="text-gray-400 hover:text-rose-400 icon-3d flex flex-col items-center"><i class="fa-solid fa-clapperboard text-xl"></i></button>
        <button onclick="openCreateModal()" class="bg-gradient-to-tr from-amber-500 via-rose-500 to-purple-600 text-white w-12 h-12 rounded-full flex items-center justify-center shadow-lg shadow-rose-500/40 icon-3d -mt-5"><i class="fa-solid fa-plus text-xl"></i></button>
        <button onclick="switchTab('chat')" id="nav-chat" class="text-gray-400 hover:text-rose-400 icon-3d flex flex-col items-center"><i class="fa-solid fa-comment-dots text-xl"></i></button>
        <button onclick="switchTab('profile')" id="nav-profile" class="text-gray-400 hover:text-rose-400 icon-3d flex flex-col items-center"><i class="fa-solid fa-user text-xl"></i></button>
    </nav>

    <!-- Auth Modal (Login / Signup / Forgot Password) -->
    <div id="auth-modal" class="fixed inset-0 z-50 bg-black/85 backdrop-blur-md flex items-center justify-center p-4 hidden">
        <div class="glass-card rounded-3xl p-6 w-full max-w-sm space-y-5 shadow-2xl border border-gray-700">
            <div class="text-center space-y-1">
                <h2 class="text-3xl font-extrabold bg-gradient-to-r from-amber-500 via-rose-500 to-purple-600 bg-clip-text text-transparent">IB65</h2>
                <p id="auth-subtitle" class="text-xs text-gray-400">Login ya naya account banayein</p>
            </div>

            <div id="auth-form" class="space-y-3">
                <input type="text" id="auth-name" placeholder="Your name" class="w-full bg-gray-900/60 border border-gray-700 rounded-xl px-4 py-3 text-sm text-gray-100 placeholder-gray-500 focus:outline-none focus:border-rose-500">
                <input type="email" id="auth-email" placeholder="Email" class="w-full bg-gray-900/60 border border-gray-700 rounded-xl px-4 py-3 text-sm text-gray-100 placeholder-gray-500 focus:outline-none focus:border-rose-500">
                <input type="password" id="auth-password" placeholder="Password (6+ chars)" class="w-full bg-gray-900/60 border border-gray-700 rounded-xl px-4 py-3 text-sm text-gray-100 placeholder-gray-500 focus:outline-none focus:border-rose-500">
                
                <div class="flex space-x-2 pt-2">
                    <button onclick="handleLogin()" class="flex-1 bg-gray-800 hover:bg-gray-700 text-gray-200 font-semibold py-2.5 rounded-xl text-sm transition icon-3d">Login</button>
                    <button onclick="handleSignup()" class="flex-1 bg-gradient-to-r from-amber-500 to-rose-600 text-white font-semibold py-2.5 rounded-xl text-sm transition icon-3d shadow-lg shadow-rose-600/30">Sign up</button>
                </div>

                <!-- Forgot Password Option -->
                <div class="text-center pt-2">
                    <button onclick="handleForgotPassword()" class="text-xs text-rose-400 hover:underline">Forgot Password?</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Notification Toast -->
    <div id="toast" class="fixed bottom-20 left-1/2 -translate-x-1/2 bg-gray-900/95 text-white text-xs px-4 py-2 rounded-full border border-gray-700 shadow-xl hidden z-50"></div>

    <!-- Scripts -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, sendPasswordResetEmail, onAuthStateChanged, signOut, updateProfile } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBlM05NZl4bKjRsrZ0ZUDpjYi0fdPP2-X4",
            authDomain: "ib65-67f62.firebaseapp.com",
            projectId: "ib65-67f62",
            storageBucket: "ib65-67f62.firebasestorage.app",
            messagingSenderId: "323877271127",
            appId: "1:323877271127:web:8318d8904784503b061512"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        let selectedFileUrl = "";
        let selectedFileType = "";

        window.showToast = function(msg) {
            const t = document.getElementById('toast');
            t.innerText = msg;
            t.classList.remove('hidden');
            setTimeout(() => t.classList.add('hidden'), 3000);
        }

        window.handleMediaSelect = async function(event, type) {
            const file = event.target.files[0];
            if (!file) return;
            showToast("Uploading " + type + "...");
            const formData = new FormData();
            formData.append("file", file);
            formData.append("upload_preset", "ib65_upload");

            try {
                const res = await fetch("https://api.cloudinary.com/v1_1/mhj8jvag/auto/upload", {
                    method: "POST",
                    body: formData
                });
                const data = await res.json();
                if (data.secure_url) {
                    selectedFileUrl = data.secure_url;
                    selectedFileType = type;
                    
                    if(type === 'video') {
                        document.getElementById('video-preview').src = selectedFileUrl;
                        document.getElementById('video-preview').classList.remove('hidden');
                        document.getElementById('image-preview').classList.add('hidden');
                    } else {
                        document.getElementById('image-preview').src = selectedFileUrl;
                        document.getElementById('image-preview').classList.remove('hidden');
                        document.getElementById('video-preview').classList.add('hidden');
                    }
                    document.getElementById('media-preview-container').classList.remove('hidden');
                    showToast("Uploaded successfully!");
                }
            } catch (err) {
                showToast("Upload failed!");
            }
        }

        window.removeMedia = function() {
            selectedFileUrl = "";
            selectedFileType = "";
            document.getElementById('media-preview-container').classList.add('hidden');
        }

        window.handleReelUpload = async function(event) {
            const file = event.target.files[0];
            if (!file) return;
            
            showToast("Uploading reel...");
            const formData = new FormData();
            formData.append("file", file);
            formData.append("upload_preset", "ib65_upload");

            try {
                const res = await fetch("https://api.cloudinary.com/v1_1/mhj8jvag/auto/upload", {
                    method: "POST",
                    body: formData
                });
                const data = await res.json();
                if (data.secure_url) {
                    const currentUser = auth.currentUser;
                    const reels = JSON.parse(localStorage.getItem('ib65_reels') || '[]');
                    const newReel = {
                        id: Date.now().toString(),
                        authorUid: currentUser?.uid || 'guest',
                        authorEmail: currentUser?.email || '',
                        author: currentUser?.displayName || 'User',
                        videoUrl: data.secure_url
                    };
                    reels.unshift(newReel);
                    localStorage.setItem('ib65_reels', JSON.stringify(reels));
                    loadReels();
                    showToast("Reel uploaded successfully!");
                }
            } catch (err) {
                showToast("Reel upload failed!");
            }
        }

        onAuthStateChanged(auth, (user) => {
            if (user) {
                document.getElementById('auth-modal').classList.add('hidden');
                const initial = user.displayName ? user.displayName[0].toUpperCase() : 'U';
                document.getElementById('user-initial').innerText = initial;
                document.getElementById('header-user-avatar').innerText = initial;
                
                document.getElementById('profile-initial').innerText = initial;
                document.getElementById('profile-name').innerText = user.displayName || 'User Name';
                document.getElementById('profile-email').innerText = user.email || '';
                loadPosts();
                loadReels();
                loadChatMessages();
            } else {
                document.getElementById('auth-modal').classList.remove('hidden');
            }
        });

        window.handleSignup = async function() {
            const name = document.getElementById('auth-name').value;
            const email = document.getElementById('auth-email').value;
            const password = document.getElementById('auth-password').value;
            if(!name || !email || password.length < 6) {
                showToast("Valid details bharein (Password 6+ chars)");
                return;
            }
            try {
                const res = await createUserWithEmailAndPassword(auth, email, password);
                await updateProfile(res.user, { displayName: name });
                showToast("Account ban gaya!");
            } catch(e) {
                showToast(e.message);
            }
        }

        window.handleLogin = async function() {
            const email = document.getElementById('auth-email').value;
            const password = document.getElementById('auth-password').value;
            try {
                await signInWithEmailAndPassword(auth, email, password);
                showToast("Login successful!");
            } catch(e) {
                showToast("Login failed: " + e.message);
            }
        }

        window.handleForgotPassword = async function() {
            const email = document.getElementById('auth-email').value;
            if(!email) {
                showToast("Pehle apna email enter karein!");
                return;
            }
            try {
                await sendPasswordResetEmail(auth, email);
                showToast("Password reset link email par bhej di gayi hai!");
            } catch(e) {
                showToast("Error: " + e.message);
            }
        }

        window.handleLogout = async function() {
            await signOut(auth);
            showToast("Logged out successfully");
        }

        window.toggleEditProfile = function() {
            const box = document.getElementById('edit-profile-box');
            box.classList.toggle('hidden');
        }

        window.saveProfile = async function() {
            const newName = document.getElementById('edit-name-input').value;
            if(!newName) return;
            try {
                await updateProfile(auth.currentUser, { displayName: newName });
                document.getElementById('profile-name').innerText = newName;
                document.getElementById('user-initial').innerText = newName[0].toUpperCase();
                document.getElementById('header-user-avatar').innerText = newName[0].toUpperCase();
                document.getElementById('profile-initial').innerText = newName[0].toUpperCase();
                toggleEditProfile();
                showToast("Profile updated successfully!");
                loadPosts();
            } catch(e) {
                showToast("Update failed: " + e.message);
            }
        }

        window.createPost = function() {
            const text = document.getElementById('post-text').value;
            if(!text && !selectedFileUrl) return;

            const currentUser = auth.currentUser;
            const posts = JSON.parse(localStorage.getItem('ib65_posts') || '[]');
            const newPost = {
                id: Date.now().toString(),
                authorUid: currentUser?.uid || 'guest',
                authorEmail: currentUser?.email || '',
                author: currentUser?.displayName || 'User',
                text: text,
                mediaUrl: selectedFileUrl,
                mediaType: selectedFileType
            };
            posts.unshift(newPost);
            localStorage.setItem('ib65_posts', JSON.stringify(posts));
            
            document.getElementById('post-text').value = '';
            removeMedia();
            loadPosts();
            showToast("Post published!");
        }

        window.loadPosts = function(filterQuery = '') {
            const container = document.getElementById('posts-container');
            const gridContainer = document.getElementById('my-posts-grid');
            const posts = JSON.parse(localStorage.getItem('ib65_posts') || '[]');
            const currentUser = auth.currentUser;

            const filteredPosts = posts.filter(p => {
                const matchText = (p.text || '').toLowerCase().includes(filterQuery.toLowerCase());
                const matchAuthor = (p.author || '').toLowerCase().includes(filterQuery.toLowerCase());
                return matchText || matchAuthor;
            });

            if(filteredPosts.length === 0) {
                container.innerHTML = `<div class="text-center text-gray-500 py-8">No posts found.</div>`;
            } else {
                container.innerHTML = filteredPosts.map(p => {
                    const isOwner = currentUser && (p.authorUid === currentUser.uid || p.authorEmail === currentUser.email);
                    return `
                    <div class="glass-card rounded-2xl p-4 space-y-3 shadow-lg">
                        <div class="flex justify-between items-center">
                            <div class="flex items-center space-x-2">
                                <div class="w-8 h-8 rounded-full bg-gradient-to-tr from-amber-500 to-rose-600 flex items-center justify-center font-bold text-xs text-white">${p.author[0]}</div>
                                <span class="font-semibold text-sm text-gray-200">${p.author}</span>
                            </div>
                            ${isOwner ? `<button onclick="deletePost('${p.id}')" class="text-gray-500 hover:text-red-500 text-xs icon-3d"><i class="fa-solid fa-trash"></i> Delete</button>` : ''}
                        </div>
                        ${p.text ? `<p class="text-sm text-gray-300">${p.text}</p>` : ''}
                        ${p.mediaUrl ? (
                            p.mediaType === 'video' ? 
                            `<video src="${p.mediaUrl}" class="rounded-xl w-full max-h-64 object-cover shadow-md" controls></video>` :
                            `<img src="${p.mediaUrl}" class="rounded-xl w-full max-h-64 object-cover shadow-md">`
                        ) : ''}
                    </div>
                `}).join('');
            }

            // Load user's own posts grid in Profile
            if(currentUser) {
                const myPosts = posts.filter(p => p.authorUid === currentUser.uid || p.authorEmail === currentUser.email);
                if(myPosts.length === 0) {
                    gridContainer.innerHTML = `<div class="text-center text-gray-500 col-span-2 py-4 text-xs">No posts yet</div>`;
                } else {
                    gridContainer.innerHTML = myPosts.map(p => `
                        <div class="relative rounded-xl overflow-hidden glass-card h-32 flex items-center justify-center">
                            ${p.mediaUrl ? (
                                p.mediaType === 'video' ? `<video src="${p.mediaUrl}" class="w-full h-full object-cover"></video>` : `<img src="${p.mediaUrl}" class="w-full h-full object-cover">`
                            ) : `<div class="p-2 text-xs text-gray-300 text-center">${p.text}</div>`}
                        </div>
                    `).join('');
                }
            }
        }

        window.deletePost = function(id) {
            let posts = JSON.parse(localStorage.getItem('ib65_posts') || '[]');
            posts = posts.filter(p => p.id !== id);
            localStorage.setItem('ib65_posts', JSON.stringify(posts));
            loadPosts();
            showToast("Post deleted!");
        }

        window.loadReels = function() {
            const container = document.getElementById('reels-container');
            const reels = JSON.parse(localStorage.getItem('ib65_reels') || '[]');
            const currentUser = auth.currentUser;

            if(reels.length === 0) {
                container.innerHTML = `<div class="text-center text-gray-500 py-8">No reels uploaded yet.</div>`;
                return;
            }

            container.innerHTML = reels.map(r => {
                const isOwner = currentUser && (r.authorUid === currentUser.uid || r.authorEmail === currentUser.email);
                return `
                <div class="glass-card rounded-2xl p-4 space-y-3 shadow-lg">
                    <div class="flex justify-between items-center">
                        <div class="flex items-center space-x-2">
                            <div class="w-8 h-8 rounded-full bg-gradient-to-tr from-amber-500 to-rose-600 flex items-center justify-center font-bold text-xs text-white">${r.author[0]}</div>
                            <span class="font-semibold text-sm text-gray-200">${r.author}</span>
                        </div>
                        ${isOwner ? `<button onclick="deleteReel('${r.id}')" class="text-gray-500 hover:text-red-500 text-xs icon-3d"><i class="fa-solid fa-trash"></i> Delete</button>` : ''}
                    </div>
                    <video src="${r.videoUrl}" class="rounded-xl w-full max-h-96 object-cover shadow-md" controls></video>
                </div>
            `}).join('');
        }

        window.deleteReel = function(id) {
            let reels = JSON.parse(localStorage.getItem('ib65_reels') || '[]');
            reels = reels.filter(r => r.id !== id);
            localStorage.setItem('ib65_reels', JSON.stringify(reels));
            loadReels();
            showToast("Reel deleted!");
        }

        // Live Chat (Instagram Grama Style DM)
        window.sendChatMessage = function() {
            const input = document.getElementById('chat-input');
            const text = input.value.trim();
            if(!text) return;

            const currentUser = auth.currentUser;
            const messages = JSON.parse(localStorage.getItem('ib65_chat') || '[]');
            const newMsg = {
                id: Date.now().toString(),
                sender: currentUser?.displayName || 'User',
                email: currentUser?.email || '',
                text: text,
                time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
            };
            messages.push(newMsg);
            localStorage.setItem('ib65_chat', JSON.stringify(messages));
            input.value = '';
            loadChatMessages();
        }

        window.loadChatMessages = function() {
            const container = document.getElementById('chat-messages-container');
            const messages = JSON.parse(localStorage.getItem('ib65_chat') || '[]');
            const currentUser = auth.currentUser;

            if(messages.length === 0) {
                container.innerHTML = `<div class="text-center text-gray-500 text-xs py-4">No messages yet. Start a conversation!</div>`;
                return;
            }

            container.innerHTML = messages.map(m => {
                const isMe = currentUser && m.email === currentUser.email;
                return `
                <div class="flex flex-col ${isMe ? 'items-end' : 'items-start'} space-y-1">
                    <span class="text-[10px] text-gray-400 px-1">${m.sender}</span>
                    <div class="max-w-[75%] px-4 py-2 rounded-2xl text-sm shadow-md ${isMe ? 'bg-gradient-to-r from-amber-500 to-rose-600 text-white rounded-br-none' : 'glass-card text-gray-200 rounded-bl-none'}">
                        ${m.text}
                    </div>
                </div>
            `}).join('');
            container.scrollTop = container.scrollHeight;
        }

        window.globalSearch = function() {
            const query = document.getElementById('global-search').value;
            loadPosts(query);
        }

        window.switchTab = function(tab) {
            const tabs = ['home', 'reels', 'chat', 'profile'];
            tabs.forEach(t => {
                const viewEl = document.getElementById('view-' + t);
                const navEl = document.getElementById('nav-' + t);
                if(viewEl) viewEl.classList.add('hidden');
                if(navEl) {
                    navEl.classList.remove('text-rose-500');
                    navEl.classList.add('text-gray-400');
                }
            });

            const activeView = document.getElementById('view-' + tab);
            const activeNav = document.getElementById('nav-' + tab);
            if(activeView) activeView.classList.remove('hidden');
            if(activeNav) {
                activeNav.classList.remove('text-gray-400');
                activeNav.classList.add('text-rose-500');
            }
            if(tab === 'chat') loadChatMessages();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        window.openCreateModal = function() {
            switchTab('home');
            window.scrollTo({ top: 0, behavior: 'smooth' });
            document.getElementById('post-text').focus();
        }
    </script>
</body>
</html>
