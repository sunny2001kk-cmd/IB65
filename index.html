<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IB65 — Social Platform</title>

  <!-- Firebase Compat Scripts -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>

  <style>
    :root {
      --bg: #0b0e14;
      --card: #151a24;
      --card-hover: #1c2230;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --text: #f3f4f6;
      --muted: #9ca3af;
      --border: #262f40;
      --radius: 14px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); min-height: 100vh; padding-bottom: 70px; }

    /* Layout */
    .app-container { max-width: 1080px; margin: 0 auto; display: grid; grid-template-columns: 240px 1fr 280px; gap: 20px; padding: 20px 10px; }
    @media (max-width: 900px) { .app-container { grid-template-columns: 1fr; } .sidebar-left, .sidebar-right { display: none; } }

    /* UI Components */
    .card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; margin-bottom: 16px; }
    .row { display: flex; align-items: center; }
    .avatar { width: 42px; height: 42px; border-radius: 50%; background: var(--primary); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: bold; overflow: hidden; flex-shrink: 0; }
    .avatar img { width: 100%; height: 100%; object-fit: cover; }
    .logo { width: 44px; height: 44px; border-radius: 12px; background: var(--primary); display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: bold; color: #fff; }

    input, textarea { width: 100%; background: #0e121a; border: 1px solid var(--border); border-radius: 10px; color: var(--text); padding: 10px 14px; margin-top: 8px; margin-bottom: 12px; outline: none; }
    input:focus, textarea:focus { border-color: var(--primary); }
    textarea { resize: vertical; min-height: 80px; }

    button { cursor: pointer; border: 0; border-radius: 10px; padding: 8px 16px; font-weight: 600; transition: 0.2s; }
    button.primary { background: var(--primary); color: #fff; }
    button.primary:hover { background: var(--primary-hover); }
    button.pill { background: rgba(255, 255, 255, 0.08); color: var(--text); border: 1px solid var(--border); }
    button.pill:hover { background: rgba(255, 255, 255, 0.15); }
    button.icon { background: transparent; color: var(--muted); font-size: 18px; padding: 6px 10px; }
    button.liked { color: #ef4444; }
    button.saved { color: #f59e0b; }

    /* Navigation */
    .nav-btn { display: flex; align-items: center; gap: 12px; width: 100%; padding: 12px; text-align: left; background: transparent; color: var(--text); border-radius: 10px; margin-bottom: 4px; }
    .nav-btn:hover, .nav-btn.active { background: var(--card); color: var(--primary); }
    .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: var(--card); border-top: 1px solid var(--border); display: flex; justify-content: space-around; padding: 10px; z-index: 1000; }
    @media (min-width: 901px) { .bottom-nav { display: none; } }

    /* Post Card */
    .post-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .post-head .user { display: flex; align-items: center; gap: 10px; }
    .name { font-weight: 600; font-size: 15px; }
    .handle { font-size: 13px; color: var(--muted); }
    .post-actions { display: flex; justify-content: space-around; border-top: 1px solid var(--border); margin-top: 12px; padding-top: 8px; }
    .media img, .media video { width: 100%; border-radius: 10px; margin-top: 10px; max-height: 480px; object-fit: cover; }

    /* Comments & Chat */
    .comments { margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--border); }
    .comment { display: flex; gap: 10px; margin-bottom: 8px; font-size: 13px; }
    .hidden { display: none !important; }
    .notice { background: rgba(59, 130, 246, 0.1); border: 1px solid rgba(59, 130, 246, 0.2); padding: 10px; border-radius: 8px; font-size: 13px; margin: 10px 0; }
    .upload-label { cursor: pointer; padding: 8px 12px; background: rgba(255,255,255,0.06); border-radius: 8px; font-size: 13px; margin-right: 8px; display: inline-flex; align-items: center; gap: 6px; }
    .upload-label input { display: none; }

    /* Modal */
    #modal { display: none; position: fixed; inset: 0; background: rgba(0, 0, 0, 0.7); z-index: 9999; align-items: center; justify-content: center; padding: 16px; }
    #modal.show { display: flex; }
    #modalBox { background: var(--card); border: 1px solid var(--border); border-radius: 16px; width: 100%; max-width: 480px; padding: 20px; max-height: 90vh; overflow-y: auto; }
    #toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #22c55e; color: #fff; padding: 10px 20px; border-radius: 20px; font-weight: 600; display: none; z-index: 100001; }
    #toast.show { display: block; }
  </style>
</head>
<body>

  <div class="app-container">
    <!-- Left Navigation -->
    <aside class="sidebar-left">
      <div class="logo" style="margin-bottom:20px;">IB</div>
      <button class="nav-btn active" onclick="navigate(this, 'Home')">🏠 Home</button>
      <button class="nav-btn" onclick="navigate(this, 'Explore')">🔍 Explore</button>
      <button class="nav-btn" onclick="navigate(this, 'Reels')">🎬 Reels</button>
      <button class="nav-btn" onclick="navigate(this, 'Messages')">💬 Messages</button>
      <button class="nav-btn" onclick="openNotifications()">🔔 Notifications <span id="notifCount"></span></button>
      <button class="nav-btn" onclick="openProfile()">👤 Profile</button>
      <button class="primary" style="width:100%; margin-top: 15px;" onclick="openCreate()">+ New Post</button>
    </aside>

    <!-- Main Feed -->
    <main>
      <div class="card row" style="gap: 12px; cursor:pointer;" onclick="openCreate()">
        <div id="composerAvatar" class="avatar">M</div>
        <div style="color:var(--muted); flex:1;">What's on your mind?</div>
        <button class="primary" style="padding:6px 12px;">Post</button>
      </div>

      <input id="search" placeholder="Search posts or creators... (Ctrl+K)" oninput="renderFeed()" />
      <div id="feed"></div>
    </main>

    <!-- Right Sidebar -->
    <aside class="sidebar-right">
      <div id="profileCard" class="card" style="text-align:center;"></div>
      <div id="suggestions" class="card"></div>
    </aside>
  </div>

  <!-- Mobile Bottom Nav -->
  <div class="bottom-nav">
    <button class="icon" onclick="navigate(this, 'Home')">🏠</button>
    <button class="icon" onclick="navigate(this, 'Explore')">🔍</button>
    <button class="primary" style="padding: 4px 14px; border-radius: 50%;" onclick="openCreate()">+</button>
    <button class="icon" onclick="navigate(this, 'Messages')">💬</button>
    <button class="icon" onclick="openProfile()">👤</button>
  </div>

  <!-- Modal Container -->
  <div id="modal"><div id="modalBox"></div></div>
  <div id="toast"></div>

  <!-- Logic Script -->
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBlM05NZl4bKjRsrZ0ZUDpjYi0fdPP2-X4",
      authDomain: "ib65-67f62.firebaseapp.com",
      projectId: "ib65-67f62",
      storageBucket: "ib65-67f62.firebasestorage.app",
      messagingSenderId: "323877271127",
      appId: "1:323877271127:web:8318d8904784503b061512",
      measurementId: "G-GZKXSWQGRV"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();
    const storage = firebase.storage();

    const KEY = 'ib65_v3_state';
    let currentUser = null;
    let firebaseReady = false;
    let activeChatUnsubscribe = null;

    const defaultState = {
      user: { name: 'Manish', handle: '@manish', initial: 'M', bio: 'Building IB65 🚀', followers: 0, following: 0, avatar: '' },
      following: [],
      saved: [],
      notifications: [{ text: 'Welcome to IB65! 🎉', time: 'Now' }],
      posts: []
    };

    let state = loadLocal();

    function loadLocal() {
      try {
        return Object.assign({}, defaultState, JSON.parse(localStorage.getItem(KEY) || '{}'));
      } catch (e) {
        return JSON.parse(JSON.stringify(defaultState));
      }
    }

    function saveLocal() {
      try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}
    }

    function esc(s) {
      return String(s ?? '').replace(/[&<>'"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[c]));
    }

    function avatarHTML(initial, avatar, cls = 'avatar') {
      return avatar
        ? `<div class="${cls}"><img src="${esc(avatar)}" alt=""></div>`
        : `<div class="${cls}">${esc(initial || '?')}</div>`;
    }

    /* AUTH OBSERVER */
    auth.onAuthStateChanged(async user => {
      currentUser = user;
      if (user) {
        firebaseReady = true;
        try {
          await loadFirebaseUser();
          await loadFirebasePosts();
          await loadFollowing();
          render();
          toast('Firebase connected ✓');
        } catch (error) {
          console.error('Init error:', error);
        }
      } else {
        firebaseReady = false;
        showLogin();
      }
    });

    function showLogin() {
      openModal(`
        <div style="text-align:center;padding:10px">
          <div class="logo" style="margin:auto;width:58px;height:58px"><b>IB</b></div>
          <h2 style="margin-top:10px;">Welcome to IB65</h2>
          <p class="small" style="color:var(--muted); margin-bottom:14px;">Login ya naya account banayein</p>
          <input id="authName" placeholder="Your name" autocomplete="name">
          <input id="authEmail" type="email" placeholder="Email" autocomplete="email">
          <input id="authPassword" type="password" placeholder="Password" autocomplete="current-password">
          <div class="row" style="gap:10px; margin-top:10px;">
            <button class="pill" style="flex:1" onclick="loginUser()">Login</button>
            <button class="primary" style="flex:1" onclick="signupUser()">Sign up</button>
          </div>
        </div>
      `);
    }

    async function signupUser() {
      const name = document.getElementById('authName')?.value.trim();
      const email = document.getElementById('authEmail')?.value.trim();
      const password = document.getElementById('authPassword')?.value;
      if (!name || !email || password.length < 6) return toast('Form sahi se bharein (Password 6+ chars)');

      try {
        showLoading('Account banaya ja raha hai...');
        const result = await auth.createUserWithEmailAndPassword(email, password);
        const handle = '@' + name.toLowerCase().replace(/[^a-z0-9]/g, '').slice(0, 18) + Math.floor(Math.random() * 1000);
        await db.collection('users').doc(result.user.uid).set({
          uid: result.user.uid, name: name, handle: handle, initial: name.charAt(0).toUpperCase(),
          bio: 'Building IB65 🚀', avatar: '', followers: 0, following: 0, email: email,
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });
        hideLoading();
        closeModal();
        toast('Account created ✓');
      } catch (e) {
        hideLoading();
        toast(e.message);
      }
    }

    async function loginUser() {
      const email = document.getElementById('authEmail')?.value.trim();
      const password = document.getElementById('authPassword')?.value;
      if (!email || !password) return toast('Email aur Password dalein');
      try {
        showLoading('Login ho raha hai...');
        await auth.signInWithEmailAndPassword(email, password);
        hideLoading();
        closeModal();
        toast('Login successful ✓');
      } catch (e) {
        hideLoading();
        toast(e.message);
      }
    }

    async function loadFirebaseUser() {
      if (!currentUser) return;
      const doc = await db.collection('users').doc(currentUser.uid).get();
      if (doc.exists) {
        const d = doc.data();
        state.user = {
          name: d.name || 'User', handle: d.handle || '@user',
          initial: d.initial || d.name?.charAt(0).toUpperCase() || 'U',
          bio: d.bio || 'Building IB65 🚀', followers: Number(d.followers || 0),
          following: Number(d.following || 0), avatar: d.avatar || ''
        };
      }
      saveLocal();
    }

    /* POSTS FEED */
    async function loadFirebasePosts() {
      if (!firebaseReady) return;
      try {
        const snap = await db.collection('posts').orderBy('createdAt', 'desc').limit(50).get();
        state.posts = snap.docs.map(doc => {
          const p = doc.data();
          const likedBy = Array.isArray(p.likedBy) ? p.likedBy : [];
          return {
            id: doc.id, uid: p.uid || '', user: p.user || 'User', handle: p.handle || '@user',
            initial: p.initial || 'U', text: p.text || '', likes: Number(p.likeCount || 0),
            likedBy: likedBy, liked: currentUser ? likedBy.includes(currentUser.uid) : false,
            comments: Array.isArray(p.comments) ? p.comments : [], media: p.media || '',
            type: p.type || 'text', createdAt: p.createdAt || null
          };
        });
        saveLocal();
      } catch (e) {
        console.error('Posts load error:', e);
      }
    }

    async function loadFollowing() {
      if (!currentUser) return;
      try {
        const snap = await db.collection('follows').where('followerId', '==', currentUser.uid).get();
        state.following = snap.docs.map(d => d.data().followingId);
        saveLocal();
      } catch (e) {}
    }

    function renderFeed() {
      const feed = document.getElementById('feed');
      if (!feed) return;
      const q = (document.getElementById('search')?.value || '').toLowerCase();
      const filtered = state.posts.filter(p => (p.text + p.user + p.handle).toLowerCase().includes(q));

      feed.innerHTML = filtered.map(postHTML).join('') || `
        <div class="card" style="text-align:center; color:var(--muted); padding:30px;">
          ${firebaseReady ? 'Koi post nahi mili. Pehla post banayein! 🚀' : 'Firebase connect ho raha hai...'}
        </div>`;
    }

    function postHTML(p) {
      const isSaved = state.saved.includes(p.id);
      const isFollowing = state.following.includes(p.uid);

      return `
        <article class="card post" id="post-${esc(p.id)}">
          <div class="post-head">
            <div class="user">
              ${avatarHTML(p.initial, p.uid === currentUser?.uid ? state.user.avatar : '', 'avatar')}
              <div>
                <div class="name">${esc(p.user)}</div>
                <div class="handle">${esc(p.handle)}</div>
              </div>
            </div>
            ${p.uid !== currentUser?.uid ? `
              <button class="pill" onclick="followUser('${esc(p.uid)}')">${isFollowing ? 'Following' : 'Follow'}</button>
            ` : ''}
          </div>
          ${p.text ? `<p style="margin: 8px 0; line-height:1.4;">${esc(p.text)}</p>` : ''}
          ${p.media ? `
            <div class="media">
              ${p.type === 'video' ? `<video src="${esc(p.media)}" controls playsinline></video>` : `<img src="${esc(p.media)}" loading="lazy" onclick="openMediaViewer('${esc(p.media)}')">`}
            </div>` : ''}
          <div class="post-actions">
            <button class="${p.liked ? 'liked' : ''}" onclick="likePost('${esc(p.id)}')">♥ ${p.likes}</button>
            <button onclick="toggleComments('${esc(p.id)}')">💬 ${p.comments?.length || 0}</button>
            <button onclick="sharePost('${esc(p.id)}')">↗ Share</button>
            <button class="${isSaved ? 'saved' : ''}" onclick="toggleSave('${esc(p.id)}')">🔖</button>
          </div>
          <div id="comments-${esc(p.id)}" class="comments hidden">
            <div id="commentList-${esc(p.id)}"></div>
            <div class="row" style="gap:6px; margin-top:8px;">
              <input id="comment-input-${esc(p.id)}" placeholder="Write a comment..." style="margin:0;" onkeydown="if(event.key==='Enter') addComment('${esc(p.id)}')">
              <button class="primary" onclick="addComment('${esc(p.id)}')">Send</button>
            </div>
          </div>
        </article>`;
    }

    async function likePost(id) {
      if (!currentUser) return showLogin();
      const post = state.posts.find(p => p.id === id);
      if (!post) return;
      const ref = db.collection('posts').doc(id);
      const isLiked = (post.likedBy || []).includes(currentUser.uid);

      await ref.update({
        likedBy: isLiked ? firebase.firestore.FieldValue.arrayRemove(currentUser.uid) : firebase.firestore.FieldValue.arrayUnion(currentUser.uid),
        likeCount: firebase.firestore.FieldValue.increment(isLiked ? -1 : 1)
      });
      await loadFirebasePosts();
      render();
    }

    function toggleComments(id) {
      const box = document.getElementById('comments-' + id);
      if (!box) return;
      box.classList.toggle('hidden');
      if (!box.classList.contains('hidden')) loadComments(id);
    }

    async function loadComments(postId) {
      const list = document.getElementById('commentList-' + postId);
      if (!list) return;
      const snap = await db.collection('posts').doc(postId).collection('comments').orderBy('createdAt', 'asc').get();
      list.innerHTML = snap.docs.map(d => {
        const c = d.data();
        return `
          <div class="comment">
            <b>${esc(c.user)}:</b>
            <span>${esc(c.text)}</span>
          </div>`;
      }).join('') || '<p class="small" style="color:var(--muted)">No comments yet.</p>';
    }

    async function addComment(postId) {
      if (!currentUser) return showLogin();
      const input = document.getElementById('comment-input-' + postId);
      const text = input?.value.trim();
      if (!text) return;

      input.value = '';
      await db.collection('posts').doc(postId).collection('comments').add({
        uid: currentUser.uid, user: state.user.name, text: text,
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      });
      loadComments(postId);
      toast('Comment posted ✓');
    }

    /* CREATE POST */
    function openCreate() {
      if (!currentUser) return showLogin();
      openModal(`
        <div class="row" style="justify-content:space-between;">
          <h2>Create Post</h2>
          <button class="icon" onclick="closeModal()">✕</button>
        </div>
        <textarea id="postText" placeholder="Share something with IB65..."></textarea>
        <div class="row" style="margin-bottom:10px;">
          <label class="upload-label">🖼 Photo <input id="photoInput" type="file" accept="image/*" onchange="previewUpload(this,'image')"></label>
          <label class="upload-label">🎬 Video <input id="videoInput" type="file" accept="video/*" onchange="previewUpload(this,'video')"></label>
        </div>
        <div id="uploadPreview"></div>
        <div class="row" style="justify-content:flex-end; gap:8px; margin-top:14px;">
          <button class="pill" onclick="closeModal()">Cancel</button>
          <button class="primary" onclick="createPost()">Publish</button>
        </div>
      `);
      window.pendingMedia = null;
    }

    function previewUpload(input, type) {
      const file = input.files?.[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = e => {
        window.pendingMedia = { file: file, type: type };
        document.getElementById('uploadPreview').innerHTML = type === 'video'
          ? `<video src="${e.target.result}" controls style="width:100%; border-radius:10px; max-height:220px;"></video>`
          : `<img src="${e.target.result}" style="width:100%; border-radius:10px; max-height:220px; object-fit:contain;">`;
      };
      reader.readAsDataURL(file);
    }

    async function createPost() {
      const text = document.getElementById('postText')?.value.trim() || '';
      const media = window.pendingMedia;
      if (!text && !media) return toast('Kuch likhein ya photo/video attach karein');

      try {
        showLoading('Uploading post...');
        let mediaUrl = '';
        if (media?.file) {
          const path = `posts/${currentUser.uid}/${Date.now()}_${media.file.name}`;
          const snap = await storage.ref().child(path).put(media.file);
          mediaUrl = await snap.ref.getDownloadURL();
        }

        await db.collection('posts').add({
          uid: currentUser.uid, user: state.user.name, handle: state.user.handle,
          initial: state.user.initial, text: text, likeCount: 0, likedBy: [],
          media: mediaUrl, type: media ? media.type : 'text',
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });

        hideLoading();
        closeModal();
        await loadFirebasePosts();
        render();
        toast('Post published ✓');
      } catch (e) {
        hideLoading();
        toast('Error: ' + e.message);
      }
    }

    /* REAL-TIME 1-ON-1 CHAT MODULE */
    async function openMessages() {
      if (!currentUser) return showLogin();
      openModal(`
        <div class="row" style="justify-content:space-between; align-items:center;">
          <h2 style="margin:0">Messages</h2>
          <button class="icon" onclick="closeModal()">✕</button>
        </div>
        <div id="chatContainer" style="margin-top:14px; min-height:360px;">
          <div id="chatUsersList">
            <p class="small" style="color:var(--muted); margin-bottom:10px;">Select a user to start conversation:</p>
            <div id="usersListContent">Loading users...</div>
          </div>
          <div id="activeChatBox" class="hidden"></div>
        </div>
      `);
      loadChatUsers();
    }

    async function loadChatUsers() {
      const container = document.getElementById('usersListContent');
      if (!container) return;
      try {
        const snap = await db.collection('users').limit(30).get();
        const users = snap.docs.map(doc => doc.data()).filter(u => u.uid !== currentUser.uid);

        if (!users.length) {
          container.innerHTML = `<p class="small" style="color:var(--muted)">No other users found.</p>`;
          return;
        }

        container.innerHTML = users.map(u => `
          <div class="card row" style="align-items:center; justify-content:space-between; padding:10px; margin-bottom:8px; cursor:pointer;" onclick="openChatWith('${esc(u.uid)}', '${esc(u.name)}')">
            <div class="row" style="align-items:center; gap:10px;">
              ${avatarHTML(u.initial || 'U', u.avatar, 'avatar')}
              <div>
                <b>${esc(u.name)}</b>
                <div class="small" style="color:var(--muted)">${esc(u.handle || '')}</div>
              </div>
            </div>
            <button class="pill" style="font-size:12px;">Chat</button>
          </div>
        `).join('');
      } catch (e) {
        container.innerHTML = `<p class="small" style="color:red">Failed to load users.</p>`;
      }
    }

    function openChatWith(targetUid, targetName) {
      const chatId = [currentUser.uid, targetUid].sort().join('_');
      document.getElementById('chatUsersList')?.classList.add('hidden');
      const chatBox = document.getElementById('activeChatBox');
      if (!chatBox) return;

      chatBox.classList.remove('hidden');
      chatBox.innerHTML = `
        <div class="row" style="align-items:center; justify-content:space-between; border-bottom:1px solid var(--border); padding-bottom:8px; margin-bottom:10px;">
          <button class="pill" style="padding:4px 8px; font-size:12px;" onclick="backToUserList()">← Back</button>
          <b>${esc(targetName)}</b>
          <div style="width:40px;"></div>
        </div>
        <div id="messageStream" style="height:260px; overflow-y:auto; display:flex; flex-direction:column; gap:8px; padding-right:4px;">
          <p class="small" style="text-align:center; color:var(--muted);">Connecting chat...</p>
        </div>
        <div class="row" style="margin-top:10px; gap:8px;">
          <input id="chatInputMsg" placeholder="Type a message..." style="margin:0; flex:1;" onkeydown="if(event.key==='Enter') sendChatMessage('${chatId}')">
          <button class="primary" onclick="sendChatMessage('${chatId}')">Send</button>
        </div>
      `;
      listenForMessages(chatId);
    }

    function listenForMessages(chatId) {
      if (activeChatUnsubscribe) activeChatUnsubscribe();
      const stream = document.getElementById('messageStream');

      activeChatUnsubscribe = db.collection('chats').doc(chatId).collection('messages')
        .orderBy('createdAt', 'asc').limitToLast(60)
        .onSnapshot(snapshot => {
          if (!stream) return;
          if (snapshot.empty) {
            stream.innerHTML = `<p class="small" style="text-align:center; color:var(--muted); margin:auto;">No messages yet. Say hello! 👋</p>`;
            return;
          }
          stream.innerHTML = snapshot.docs.map(doc => {
            const msg = doc.data();
            const isMe = msg.senderId === currentUser.uid;
            return `
              <div style="align-self:${isMe ? 'flex-end' : 'flex-start'}; background:${isMe ? 'var(--primary)' : 'rgba(255,255,255,0.08)'}; color:#fff; padding:7px 12px; border-radius:${isMe ? '14px 14px 2px 14px' : '14px 14px 14px 2px'}; max-width:75%; word-break:break-word; font-size:13px;">
                ${esc(msg.text)}
              </div>`;
          }).join('');
          stream.scrollTop = stream.scrollHeight;
        });
    }

    async function sendChatMessage(chatId) {
      const input = document.getElementById('chatInputMsg');
      const text = input?.value.trim();
      if (!text || !currentUser) return;
      input.value = '';

      await db.collection('chats').doc(chatId).collection('messages').add({
        senderId: currentUser.uid, text: text, createdAt: firebase.firestore.FieldValue.serverTimestamp()
      });
      await db.collection('chats').doc(chatId).set({
        lastMessage: text, lastUpdated: firebase.firestore.FieldValue.serverTimestamp(), users: chatId.split('_')
      }, { merge: true });
    }

    function backToUserList() {
      if (activeChatUnsubscribe) { activeChatUnsubscribe(); activeChatUnsubscribe = null; }
      document.getElementById('activeChatBox')?.classList.add('hidden');
      document.getElementById('chatUsersList')?.classList.remove('hidden');
    }

    /* GENERAL HELPERS & NAVIGATION */
    async function followUser(targetUid) {
      if (!currentUser || targetUid === currentUser.uid) return;
      const followId = `${currentUser.uid}_${targetUid}`;
      const ref = db.collection('follows').doc(followId);
      const snap = await ref.get();

      if (snap.exists) {
        await ref.delete();
        state.following = state.following.filter(id => id !== targetUid);
        toast('Unfollowed');
      } else {
        await ref.set({ followerId: currentUser.uid, followingId: targetUid, createdAt: firebase.firestore.FieldValue.serverTimestamp() });
        state.following.push(targetUid);
        toast('Following ✓');
      }
      saveLocal();
      renderFeed();
    }

    function toggleSave(id) {
      const i = state.saved.indexOf(id);
      if (i >= 0) { state.saved.splice(i, 1); toast('Removed from saved'); }
      else { state.saved.push(id); toast('Saved ✓'); }
      saveLocal();
      renderFeed();
    }

    function sharePost(id) {
      const url = location.href.split('#')[0] + '#post-' + id;
      navigator.clipboard?.writeText(url).then(() => toast('Link copied ✓'));
    }

    function openMediaViewer(url) {
      const v = document.createElement('div');
      v.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.95);z-index:99999;display:flex;align-items:center;justify-content:center;padding:20px;';
      v.innerHTML = `<img src="${esc(url)}" style="max-width:100%;max-height:90vh;object-fit:contain;border-radius:10px;"><button style="position:absolute;top:20px;right:20px;background:#fff;border-radius:50%;width:36px;height:36px;" onclick="this.parentElement.remove()">✕</button>`;
      document.body.appendChild(v);
    }

    function openModal(html) {
      document.getElementById('modalBox').innerHTML = html;
      document.getElementById('modal').classList.add('show');
    }

    function closeModal() {
      if (activeChatUnsubscribe) { activeChatUnsubscribe(); activeChatUnsubscribe = null; }
      document.getElementById('modal').classList.remove('show');
    }

    function navigate(btn, name) {
      document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
      if (btn) btn.classList.add('active');
      if (name === 'Home') renderFeed();
      if (name === 'Messages') openMessages();
      if (name === 'Explore') renderFeed();
      if (name === 'Reels') openModal('<h2>Reels</h2><p class="small" style="color:var(--muted)">Short-form video stream</p>');
    }

    function openProfile() {
      openModal(`
        <div style="text-align:center;">
          ${avatarHTML(state.user.initial, state.user.avatar)}
          <h2 style="margin-top:10px;">${esc(state.user.name)}</h2>
          <div style="color:var(--muted);">${esc(state.user.handle)}</div>
          <p style="margin:10px 0;">${esc(state.user.bio)}</p>
          <button class="pill" onclick="auth.signOut(); closeModal();">Logout</button>
        </div>
      `);
    }

    function openNotifications() {
      openModal(`<h2>Notifications</h2><div class="notice">Welcome to IB65! 🎉</div>`);
    }

    function toast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2000);
    }

    function showLoading(msg) {
      let b = document.getElementById('ibLoader');
      if (!b) {
        b = document.createElement('div');
        b.id = 'ibLoader';
        b.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:100000;display:flex;align-items:center;justify-content:center;color:#fff;';
        document.body.appendChild(b);
      }
      b.innerHTML = `<div class="card" style="padding:20px;text-align:center;">⏳ ${esc(msg)}</div>`;
    }

    function hideLoading() { document.getElementById('ibLoader')?.remove(); }

    function renderProfileCard() {
      const el = document.getElementById('profileCard');
      if (!el) return;
      el.innerHTML = `
        ${avatarHTML(state.user.initial, state.user.avatar)}
        <h3 style="margin-top:8px;">${esc(state.user.name)}</h3>
        <div class="small" style="color:var(--muted);">${esc(state.user.handle)}</div>
        <p class="small" style="margin:8px 0;">${esc(state.user.bio)}</p>
        <button class="pill" style="width:100%;" onclick="openProfile()">View Profile</button>
      `;
    }

    function render() {
      renderFeed();
      renderProfileCard();
      const ca = document.getElementById('composerAvatar');
      if (ca) ca.innerHTML = state.user.avatar ? `<img src="${esc(state.user.avatar)}">` : esc(state.user.initial);
    }

    render();
  </script>
</body>
</html>
