/* =========================================
   LOCAL STORAGE
========================================= */

function loadLocal(){

  try{

    return deepMerge(
      defaultState,
      JSON.parse(localStorage.getItem(KEY) || '{}')
    );

  }catch(e){

    return JSON.parse(
      JSON.stringify(defaultState)
    );

  }

}

function deepMerge(base,extra){

  const out =
    JSON.parse(JSON.stringify(base));

  Object.keys(extra || {}).forEach(k=>{

    if(
      extra[k] &&
      typeof extra[k] === 'object' &&
      !Array.isArray(extra[k]) &&
      out[k]
    ){

      out[k] =
        Object.assign(out[k],extra[k]);

    }else{

      out[k] = extra[k];

    }

  });

  return out;
}

function saveLocal(){

  localStorage.setItem(
    KEY,
    JSON.stringify(state)
  );

}

function esc(s){

    /[&<>'"]/g,
    c => ({
      '&':'&amp;',
      '<':'&lt;',
      '>':'&gt;',
      "'":'&#39;',
      '"':'&quot;'
    }[c])
  );

}

function avatarHTML(initial,avatar,cls='avatar'){

async function signupUser(){

  const name =
    document.getElementById('authName')
    .value.trim();

  const email =
    document.getElementById('authEmail')
    .value.trim();

  const password =
    document.getElementById('authPassword')
    .value;

  if(!name)
    return toast('Name डालो');

  if(!email)
    return toast('Email डालो');

  if(password.length < 6)
    return toast('Password कम से कम 6 characters का रखें');

  try{

    const result =
      await auth.createUserWithEmailAndPassword(
        email,
        password
      );

    const user = result.user;

    const handle =
      '@' +
      name
        .toLowerCase()
        .replace(/[^a-z0-9]/g,'')
        .slice(0,18) +
      Math.floor(Math.random()*1000);

    await db
      .collection('users')
      .doc(user.uid)
      .set({

        uid:user.uid,

        name:name,

        handle:handle,

        initial:name
          .charAt(0)
          .toUpperCase(),

        bio:'Building IB65 🚀',

        avatar:'',

        followers:0,

        following:0,

        email:user.email,

        createdAt:
          firebase.firestore.FieldValue.serverTimestamp()

      });

    toast('Account created ✓');

    closeModal();

  }catch(error){

    console.error(error);

    toast(
      firebaseError(error)
    );

  }

}


async function loginUser(){

  const email =
    document.getElementById('authEmail')
    .value.trim();

  const password =
    document.getElementById('authPassword')
    .value;

  if(!email || !password)
    return toast('Email और password डालो');

  try{

    await auth
      .signInWithEmailAndPassword(
        email,
        password
      );

    closeModal();

    toast('Login successful ✓');

  }catch(error){

    console.error(error);

    toast(
      firebaseError(error)
    );

  }

}


function firebaseError(error){

  const code = error?.code || '';

  if(code.includes('invalid-credential'))
    return 'Email या password गलत है';

  if(code.includes('email-already-in-use'))
    return 'यह email पहले से registered है';

  if(code.includes('invalid-email'))
    return 'Email सही नहीं है';

  if(code.includes('weak-password'))
    return 'Password बहुत छोटा है';

  if(code.includes('network-request-failed'))
    return 'Internet connection check करो';

  return 'Firebase error: ' + code;

}

async function loadFirebaseUser(){

    return;

      .doc(currentUser.uid);

  const snap =
    await ref.get();

  if(snap.exists){

    const data = snap.data();

    state.user = {

      name:data.name || 'User',

      handle:data.handle || '@user',

      initial:data.initial ||
        (data.name || 'U')
        .charAt(0)
        .toUpperCase(),

      bio:data.bio ||
        'Building IB65 🚀',

      followers:data.followers || 0,

      following:data.following || 0,

      avatar:data.avatar || ''

    };

  }else{

    await ref.set({

      uid:currentUser.uid,

      name:currentUser.email
        ?.split('@')[0] || 'User',

      handle:
        '@' +
        (
          currentUser.email
          ?.split('@')[0] || 'user'
        ),

      initial:
        (
          currentUser.email
          ?.charAt(0) || 'U'
        ).toUpperCase(),

      bio:'Building IB65 🚀',

      avatar:'',

      followers:0,

      following:0,

      email:currentUser.email,

      createdAt:
        firebase.firestore.FieldValue.serverTimestamp()

  saveLocal();

}


/* =========================================
   LOAD POSTS FROM FIRESTORE
========================================= */

async function loadFirebasePosts(){

  try{

    const snap =
      await db
        .collection('posts')
        .orderBy('createdAt','desc')
        .limit(50)
        .get();

    state.posts =
      snap.docs.map(doc => {

        const p = doc.data();

        return {

          id:doc.id,

          uid:p.uid || '',

          user:p.user || 'User',

          handle:p.handle || '@user',

          initial:p.initial || 'U',

          text:p.text || '',

          likes:p.likeCount || 0,

          liked:false,

          comments:p.comments || [],

          media:p.media || '',

          type:p.type || 'text'

        };

      });

    saveLocal();

  }catch(error){

    console.error(
      'Posts loading error:',
      error
    );

    toast('Posts load नहीं हुए');

  }

}

/* =========================================
   REAL FIRESTORE LIKE
========================================= */

async function likePost(id){

  if(!currentUser)
    return showLogin();

  const ref =
    db.collection('posts').doc(id);

  try{

    const liked =
      state.posts
        .find(p=>p.id===id)
        ?.liked;

    if(liked){

      await ref.update({

        likedBy:
          firebase.firestore.FieldValue
            .arrayRemove(currentUser.uid),

        likeCount:
          firebase.firestore.FieldValue.increment(-1)

      });

    }else{

      await ref.update({

        likedBy:
          firebase.firestore.FieldValue
            .arrayUnion(currentUser.uid),

        likeCount:
          firebase.firestore.FieldValue.increment(1)

      });

    }

    await loadFirebasePosts();

    const p =
      state.posts.find(x=>x.id===id);

    if(p){

      p.liked =
        (p.likedBy || [])
          .includes(currentUser.uid);

    }

    render();

  }catch(error){

    console.error(error);

    toast('Like नहीं हो पाया');

  }

}


/* =========================================
   COMMENTS
========================================= */

function toggleComments(id){

  document
    .getElementById('comments-'+id)
    ?.classList.toggle('hidden');

}


async function addComment(id){

  if(!currentUser)
    return showLogin();

  const input =
    document.getElementById(
      'comment-'+id
    );

  const text =
    input.value.trim();

  if(!text)
    return;

  try{

    const postRef =
      db.collection('posts')
        .doc(id);

    const comment = {

      uid:currentUser.uid,

      user:state.user.name,

      initial:state.user.initial,

      text:text,

      createdAt:
        firebase.firestore.FieldValue
          .serverTimestamp()

    };

    await postRef
      .collection('comments')
      .add(comment);

    input.value='';

    await refreshPostComments(id);

    render();

    setTimeout(()=>{

      document
        .getElementById('comments-'+id)
        ?.classList.remove('hidden');

    },50);

    toast('Comment added ✓');

  }catch(error){

    console.error(error);

    toast('Comment नहीं जुड़ा');

  }

}


async function refreshPostComments(id){

  const snap =
    await db
      .collection('posts')
      .doc(id)
      .collection('comments')
      .orderBy('createdAt','asc')
      .limit(100)
      .get();

  const comments =
    snap.docs.map(d=>d.data());

  const p =
    state.posts.find(x=>x.id===id);

  if(p)
    p.comments = comments;

}

function previewUpload(input,type){

  const file =
    input.files?.[0];

  if(!file)
    return;

  if(file.size > 8*1024*1024){

    toast('File 8MB से छोटी रखें');

    input.value='';

    return;

  }

  const reader =
    new FileReader();

  reader.onload=()=>{

    window.pendingMedia={
      data:reader.result,
      type:type
    };

    document
      .getElementById('uploadPreview')
      .innerHTML =

      type === 'image'

      ? `<img
          class="preview"
          src="${reader.result}">`

      : `<video
          class="preview"
          src="${reader.result}"
          controls>
         </video>`;

  };

  reader.readAsDataURL(file);

}


async function createPost(){

  if(!currentUser)
    return showLogin();

  const text =
    document
      .getElementById('postText')
      .value
      .trim();

  if(
    !text &&
    !window.pendingMedia?.data
  ){

    return toast(
      'Post में text या media जोड़ें'
    );

  }

  try{

    const post = {

      uid:currentUser.uid,

      user:state.user.name,

      handle:state.user.handle,

      initial:state.user.initial,

      text:
        text || 'New post 🎬',

      likeCount:0,

      likedBy:[],

      media:
        window.pendingMedia?.data || '',

      type:
        window.pendingMedia?.type || 'text',

      createdAt:
        firebase.firestore.FieldValue
          .serverTimestamp()

    };

    await db
      .collection('posts')
      .add(post);

    closeModal();

    await loadFirebasePosts();

    render();

    toast('Post published online ✓');

    window.pendingMedia=null;

  }catch(error){

    console.error(error);

    toast('Post publish नहीं हुआ');

  }

}


/* =========================================
   SAVE
========================================= */

function toggleSave(id){

  const i =
    state.saved.indexOf(id);

  if(i >= 0)
    state.saved.splice(i,1);
  else
    state.saved.push(id);

  saveLocal();

  render();

  toast(
    i >= 0
      ? 'Removed from saved'
      : 'Saved ✓'
  );

}


/* =========================================
   FOLLOW
========================================= */

async function followUser(targetUid){

  if(!currentUser)
    return showLogin();

  if(!targetUid)
    return toast('User profile उपलब्ध नहीं है');

  if(targetUid === currentUser.uid)
    return;

  try{

    const followId =
      currentUser.uid + '_' + targetUid;

    const ref =
      db.collection('follows')
        .doc(followId);

    const snap =
      await ref.get();

    if(snap.exists){

      await ref.delete();

      toast('Unfollowed');

    }else{

      await ref.set({

        followerId:currentUser.uid,

        followingId:targetUid,

        createdAt:
          firebase.firestore.FieldValue
            .serverTimestamp()

      });

      toast('Following ✓');

    }

  }catch(error){

    console.error(error);

    toast('Follow नहीं हो पाया');

  }

}

    <div class="modal-actions">

      <button
        class="pill"
        onclick="openProfile()">
        Cancel
      </button>

      <button
        class="primary"
        onclick="saveProfile()">
        Save
      </button>

    </div>

  `);

}


async function saveProfile(){

  const name =
    document
      .getElementById('editName')
      .value.trim() ||
    state.user.name;

  let handle =
    document
      .getElementById('editHandle')
      .value.trim();

  const bio =
    document
      .getElementById('editBio')
      .value.trim();

  if(!handle.startsWith('@'))
    handle='@'+handle;

  const initial =
    name.charAt(0).toUpperCase();

  try{

    await db
      .collection('users')
      .doc(currentUser.uid)
      .update({

        name:name,

        handle:handle,

        initial:initial,

        bio:bio

      });

    state.user.name=name;
    state.user.handle=handle;
    state.user.initial=initial;
    state.user.bio=bio;

    saveLocal();

    await loadFirebasePosts();

    render();

    openProfile();

    toast('Profile updated ✓');

  }catch(error){

    console.error(error);

    toast('Profile update नहीं हुआ');

  }

}

/* =========================================
   SHARE
========================================= */

function sharePost(id){

  const url =
    location.href
      .split('#')[0] +
    '#post-' + id;

  if(navigator.share){

    navigator.share({

      title:'IB65',

      text:'IB65 post देखें',

      url:url

    }).catch(()=>{});

  }else{

    navigator.clipboard
      ?.writeText(url)
      .then(()=>toast('Post link copied ✓'))
      .catch(()=>toast('Link copy नहीं हुआ'));

  }

}


/* =========================================
   MODAL
========================================= */

function openModal(html){

  document
    .getElementById('modalBox')
    .innerHTML=html;

  document
    .getElementById('modal')
    .classList.add('show');

}


function closeModal(){

  document
    .getElementById('modal')
    .classList.remove('show');

}


/* =========================================
   NAVIGATION
========================================= */

function navigate(b,name){

  document
    .querySelectorAll(
      '.nav button,.bottom button'
    )
    .forEach(x =>
      x.classList.remove('active')
    );

  b.classList.add('active');

  if(name==='Home'){

    document
      .getElementById('search')
      .value='';

    renderFeed();

  }

  else if(name==='Explore')
    openExplore();

  else if(name==='Reels')
    openReels();

  else if(name==='Messages')
    openMessages();

}


/* =========================================
   TOAST
========================================= */

function toast(t){

  const e =
    document.getElementById('toast');

  if(!e)
    return;

  e.textContent=t;

  e.classList.add('show');

  clearTimeout(window.tt);

  window.tt =
    setTimeout(
      ()=>e.classList.remove('show'),
      2200
    );

}


/* =========================================
   PWA INSTALL
========================================= */

let deferredInstallPrompt=null;

window.addEventListener(
  'beforeinstallprompt',
  event=>{

    event.preventDefault();

    deferredInstallPrompt=event;

    document
      .getElementById('installApp')
      .classList.add('show');

  }
);


async function installApp(){

  if(!deferredInstallPrompt){

    toast(
      'Chrome ⋮ → Add to Home screen दबाएँ'
    );

    return;

  }

  deferredInstallPrompt.prompt();

  await deferredInstallPrompt.userChoice;

  deferredInstallPrompt=null;

  document
    .getElementById('installApp')
    .classList.remove('show');

}


/* =========================================
   KEYBOARD
========================================= */

document.addEventListener(
  'keydown',
  e=>{

    if(
      (e.ctrlKey || e.metaKey) &&
      e.key.toLowerCase()==='k'
    ){

      e.preventDefault();

      document
        .getElementById('search')
        .focus();

    }

    if(e.key==='Escape')
      closeModal();

  }
);


/* =========================================
   START
========================================= */

render();

   </script>
