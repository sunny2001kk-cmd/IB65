/* =========================================
   LOCAL STORAGE
========================================= */

function loadLocal(){

  try{

    return deepMerge(
      defaultState,
      JSON.parse(
        localStorage.getItem(KEY) || '{}'
      )
    );

  }catch(e){

    return JSON.parse(
      JSON.stringify(defaultState)
    );

  }

}


function deepMerge(base,extra){

  const out =
    JSON.parse(JSON.stringify(base));

  Object.keys(extra || {}).forEach(k=>{

    if(
      extra[k] &&
      typeof extra[k] === 'object' &&
      !Array.isArray(extra[k]) &&
      out[k]
    ){

      out[k] =
        Object.assign(out[k],extra[k]);

    }else{

      out[k] = extra[k];

    }

  });

  return out;

}


function saveLocal(){

  try{

    localStorage.setItem(
      KEY,
      JSON.stringify(state)
    );

  }catch(e){

    console.warn(
      'Local storage error',
      e
    );

  }

}

function esc(s){

  return String(s ?? '').replace(
    /[&<>'"]/g,
    c => ({
      '&':'&amp;',
      '<':'&lt;',
      '>':'&gt;',
      "'":'&#39;',
      '"':'&quot;'
    }[c])
  );

}


function avatarHTML(
  initial,
  avatar,
  cls='avatar'
){

  return avatar

    ? `<div class="${cls}">
         <img
           src="${esc(avatar)}"
           alt="">
       </div>`

    : `<div class="${cls}">
         ${esc(initial || '?')}
       </div>`;

}

async function signupUser(){

  const name =
    document
      .getElementById('authName')
      ?.value
      .trim();

  const email =
    document
      .getElementById('authEmail')
      ?.value
      .trim();

  const password =
    document
      .getElementById('authPassword')
      ?.value;

  if(!name)
    return toast('Name डालो');

  if(!email)
    return toast('Email डालो');

  if(password.length < 6)
    return toast(
      'Password कम से कम 6 characters का रखें'
    );

  try{

    showLoading(
      'Account बनाया जा रहा है...'
    );

    const result =
      await auth
        .createUserWithEmailAndPassword(
          email,
          password
        );

    const user = result.user;

    const cleanName =
      name
        .toLowerCase()
        .replace(/[^a-z0-9]/g,'')
        .slice(0,18) ||
      'user';

    const handle =
      '@' +
      cleanName +
      Math.floor(Math.random()*1000);

    await db
      .collection('users')
      .doc(user.uid)
      .set({

        uid:user.uid,

        name:name,

        handle:handle,

        initial:
          name
            .charAt(0)
            .toUpperCase(),

        bio:'Building IB65 🚀',

        avatar:'',

        followers:0,

        following:0,

        email:user.email,

        createdAt:
          firebase.firestore.FieldValue
            .serverTimestamp()

      });

    hideLoading();

    closeModal();

    toast('Account created ✓');

  }catch(error){

    console.error(error);

    hideLoading();

    toast(
      firebaseError(error)
    );

  }

}

}


function firebaseError(error){

  const code =
    error?.code || '';

  if(
    code.includes('invalid-credential')
  )
    return 'Email या password गलत है';

  if(
    code.includes('email-already-in-use')
  )
    return 'यह email पहले से registered है';

  if(
    code.includes('invalid-email')
  )
    return 'Email सही नहीं है';

  if(
    code.includes('weak-password')
  )
    return 'Password बहुत छोटा है';

  if(
    code.includes('network-request-failed')
  )
    return 'Internet connection check करो';

  if(
    code.includes('too-many-requests')
  )
    return 'बहुत ज्यादा कोशिश हुई है, थोड़ी देर बाद try करें';

  return 'Firebase error: ' + code;

}

async function loadFirebaseUser(){

  if(!currentUser)
    return;

  const ref =
    db
      .collection('users')
      .doc(currentUser.uid);

  const snap =
    await ref.get();

  if(snap.exists){

    const data =
      snap.data();

    state.user = {

      name:
        data.name ||
        'User',

      handle:
        data.handle ||
        '@user',

      initial:
        data.initial ||
        (
          data.name ||
          'U'
        )
        .charAt(0)
        .toUpperCase(),

      bio:
        data.bio ||
        'Building IB65 🚀',

      followers:
        Number(data.followers || 0),

      following:
        Number(data.following || 0),

      avatar:
        data.avatar || ''

    };

  }else{

    const name =
      currentUser
        .email
        ?.split('@')[0] ||
      'User';

    await ref.set({

      uid:currentUser.uid,

      name:name,

      handle:
        '@' +
        name
          .toLowerCase()
          .replace(/[^a-z0-9]/g,''),

      initial:
        name
          .charAt(0)
          .toUpperCase(),

      bio:'Building IB65 🚀',

      avatar:'',

      followers:0,

      following:0,

      email:currentUser.email,

      createdAt:
        firebase.firestore.FieldValue
          .serverTimestamp()

    });

    await loadFirebaseUser();

  }

  saveLocal();

}


/* =========================================
   LOAD POSTS
========================================= */

async function loadFirebasePosts(){

  if(!firebaseReady)
    return;

  try{

    const snap =
      await db
        .collection('posts')
        .orderBy(
          'createdAt',
          'desc'
        )
        .limit(50)
        .get();

    const posts =
      snap.docs.map(doc => {

        const p =
          doc.data();

        const likedBy =
          Array.isArray(p.likedBy)
            ? p.likedBy
            : [];

        return {

          id:doc.id,

          uid:p.uid || '',

          user:p.user || 'User',

          handle:p.handle || '@user',

          initial:p.initial || 'U',

          text:p.text || '',

          likes:
            Number(p.likeCount || 0),

          likedBy:likedBy,

          liked:
            currentUser
              ? likedBy.includes(
                  currentUser.uid
                )
              : false,

          comments:
            Array.isArray(p.comments)
              ? p.comments
              : [],

          media:p.media || '',

          type:p.type || 'text',

          createdAt:
            p.createdAt || null

        };

      });

    /* -----------------------------------------
       LOAD REAL COMMENTS FROM SUBCOLLECTION
    ----------------------------------------- */

    await Promise.all(

      posts.map(
        async post => {

          try{

            const commentsSnap =
              await db
                .collection('posts')
                .doc(post.id)
                .collection('comments')
                .orderBy(
                  'createdAt',
                  'asc'
                )
                .limit(100)
                .get();

            post.comments =
              commentsSnap.docs.map(
                d => ({
                  id:d.id,
                  ...d.data()
                })
              );

          }catch(commentError){

            console.warn(
              'Comment loading error:',
              commentError
            );

          }

        }
      )

    );

    state.posts = posts;

    saveLocal();

  }catch(error){

    console.error(
      'Posts loading error:',
      error
    );

    if(
      error.code ===
      'failed-precondition'
    ){

      toast(
        'Firestore index की जरूरत है'
      );

    }else{

      toast(
        'Posts load नहीं हुए'
      );

    }

  }

}

/* =========================================
   LIKE
========================================= */

async function likePost(id){

  if(!currentUser)
    return showLogin();

  const post =
    state.posts.find(
      p => p.id === id
    );

  if(!post)
    return;

  const ref =
    db.collection('posts')
      .doc(id);

  try{

    const alreadyLiked =
      (
        post.likedBy || []
      )
      .includes(
        currentUser.uid
      );

    if(alreadyLiked){

      await ref.update({

        likedBy:
          firebase.firestore.FieldValue
            .arrayRemove(
              currentUser.uid
            ),

        likeCount:
          firebase.firestore.FieldValue
            .increment(-1)

      });

    }else{

      await ref.update({

        likedBy:
          firebase.firestore.FieldValue
            .arrayUnion(
              currentUser.uid
            ),

        likeCount:
          firebase.firestore.FieldValue
            .increment(1)

      });

    }

    await loadFirebasePosts();

    render();

  }catch(error){

    console.error(
      'Like error:',
      error
    );

    toast(
      'Like नहीं हो पाया'
    );

  }

}

async function addComment(id){

  if(!currentUser)
    return showLogin();

  const input =
    document.getElementById(
      'comment-'+id
    );

  if(!input)
    return;

  const text =
    input.value.trim();

  if(!text)
    return;

  try{

    const comment = {

      uid:currentUser.uid,

      user:state.user.name,

      initial:state.user.initial,

      text:text,

      createdAt:
        firebase.firestore.FieldValue
          .serverTimestamp()

    };

    await db
      .collection('posts')
      .doc(id)
      .collection('comments')
      .add(comment);

    input.value='';

    await refreshPostComments(id);

    render();

    setTimeout(()=>{

      document
        .getElementById(
          'comments-'+id
        )
        ?.classList.remove(
          'hidden'
        );

    },50);

    toast(
      'Comment added ✓'
    );

  }catch(error){

    console.error(
      'Comment error:',
      error
    );

    toast(
      'Comment नहीं जुड़ा'
    );

  }

}


async function refreshPostComments(id){

  try{

    const snap =
      await db
        .collection('posts')
        .doc(id)
        .collection('comments')
        .orderBy(
          'createdAt',
          'asc'
        )
        .limit(100)
        .get();

    const comments =
      snap.docs.map(
        d => ({
          id:d.id,
          ...d.data()
        })
      );

    const p =
      state.posts.find(
        x => x.id === id
      );

    if(p)
      p.comments = comments;

  }catch(error){

    console.error(
      'Refresh comments error:',
      error
    );

  }

}

/* =========================================
   MEDIA PREVIEW
========================================= */

function previewUpload(input,type){

  const file =
    input.files?.[0];

  if(!file)
    return;

  /* -----------------------------------------
     TYPE CHECK
  ----------------------------------------- */

  if(
    type === 'image' &&
    !file.type.startsWith('image/')
  ){

    toast(
      'कृपया केवल Photo चुनें'
    );

    input.value='';

    return;

  }

  if(
    type === 'video' &&
    !file.type.startsWith('video/')
  ){

    toast(
      'कृपया केवल Video चुनें'
    );

    input.value='';

    return;

  }


  /* -----------------------------------------
     SIZE LIMIT
  ----------------------------------------- */

  const maxSize =
    type === 'video'
      ? 100 * 1024 * 1024
      : 10 * 1024 * 1024;

  if(file.size > maxSize){

    toast(
      type === 'video'
        ? 'Video 100 MB से छोटी रखें'
        : 'Photo 10 MB से छोटी रखें'
    );

    input.value='';

    return;

  }


  /* -----------------------------------------
     PREVIEW
  ----------------------------------------- */

  const reader =
    new FileReader();

  reader.onload = function(e){

    window.pendingMedia = {

      file:file,

      preview:e.target.result,

      type:type,

      name:file.name

    };

    const preview =
      document.getElementById(
        'uploadPreview'
      );

    if(!preview)
      return;

    if(type === 'video'){

      preview.innerHTML = `

        <video
          class="preview"
          src="${e.target.result}"
          controls
          playsinline
          style="
            width:100%;
            max-height:300px;
            border-radius:14px;
            background:#000;
          ">
        </video>

      `;

    }else{

      preview.innerHTML = `

        <img

/* =========================================
   CREATE POST + FIREBASE STORAGE
========================================= */

async function createPost(){

  if(!currentUser)
    return showLogin();

  const textEl =
    document.getElementById(
      'postText'
    );

  const text =
    textEl
      ?.value
      .trim() || '';

  const media =
    window.pendingMedia;

  if(
    !text &&
    !media?.file
  ){

    return toast(
      'Post में text या Photo/Video जोड़ें'
    );

  }

  try{

    showLoading(
      'Post upload हो रही है...'
    );


    /* -----------------------------------------
       MEDIA UPLOAD
    ----------------------------------------- */

    let mediaUrl = '';

    let mediaType = 'text';


    if(media?.file){

      const file =
        media.file;

      mediaType =
        media.type;


      const extension =
        file.name
          .split('.')
          .pop()
          .toLowerCase();


      const safeName =
        Date.now() +
        '_' +
        Math.random()
          .toString(36)
          .substring(2,10) +
        '.' +
        extension;


      const storagePath =
        `posts/${currentUser.uid}/${safeName}`;


      const storageRef =
        storage
          .ref()
          .child(storagePath);


      const uploadTask =
        await storageRef.put(
          file,
          {
            contentType:
              file.type
          }
        );


      mediaUrl =
        await uploadTask
          .ref
          .getDownloadURL();

    }


    /* -----------------------------------------
       FIRESTORE POST
    ----------------------------------------- */

    const post = {

      uid:
        currentUser.uid,

      user:
        state.user.name,

      handle:
        state.user.handle,

      initial:
        state.user.initial,

      text:
        text ||
        (
          mediaType === 'video'
            ? '🎬 New video'
            : mediaType === 'image'
              ? '📸 New photo'
              : 'New post'
        ),

      likeCount:0,

      likedBy:[],

      media:
        mediaUrl,

      type:
        mediaType,

      createdAt:
        firebase.firestore.FieldValue
          .serverTimestamp()

    };


    await db
      .collection('posts')
      .add(post);


    /* -----------------------------------------
       RESET
    ----------------------------------------- */

    window.pendingMedia = null;


    if(textEl)
      textEl.value='';


    const photo =
      document.getElementById(
        'photoInput'
      );

    const video =
      document.getElementById(
        'videoInput'
      );

    if(photo)
      photo.value='';

    if(video)
      video.value='';


    hideLoading();

    closeModal();

    await loadFirebasePosts();

    render();

    toast(
      'Post published online ✓'
    );


  }catch(error){

    console.error(
      'CREATE POST ERROR:',
      error
    );

    hideLoading();

    toast(
      'Post upload नहीं हुआ: ' +
      (
        error.message ||
        'Unknown error'
      )
    );

  }

}

/* =========================================
   FOLLOW / UNFOLLOW
========================================= */

async function followUser(targetUid){

  if(!currentUser)
    return showLogin();

  if(!targetUid)
    return toast(
      'User profile उपलब्ध नहीं है'
    );

  if(
    targetUid === currentUser.uid
  )
    return;


  try{

    showLoading(
      'Follow update हो रहा है...'
    );


    const followId =
      currentUser.uid +
      '_' +
      targetUid;


    const followRef =
      db
        .collection('follows')
        .doc(followId);


    const currentUserRef =
      db
        .collection('users')
        .doc(currentUser.uid);


    const targetUserRef =
      db
        .collection('users')
        .doc(targetUid);


    const followSnap =
      await followRef.get();


    if(followSnap.exists){

      await followRef.delete();


      await db.runTransaction(
        async transaction => {

          const targetSnap =
            await transaction.get(
              targetUserRef
            );

          const currentSnap =
            await transaction.get(
              currentUserRef
            );

          const targetData =
            targetSnap.exists
              ? targetSnap.data()
              : {};

          const currentData =
            currentSnap.exists
              ? currentSnap.data()
              : {};

          transaction.update(
            targetUserRef,
            {
              followers:
                Math.max(
                  0,
                  Number(
                    targetData.followers || 0
                  ) - 1
                )
            }
          );

          transaction.update(
            currentUserRef,
            {
              following:
                Math.max(
                  0,
                  Number(
                    currentData.following || 0
                  ) - 1
                )
            }
          );

        }
      );


      state.following =
        state.following.filter(
          id => id !== targetUid
        );

      toast(
        'Unfollowed'
      );


    }else{

      await followRef.set({

        followerId:
          currentUser.uid,

        followingId:
          targetUid,

        createdAt:
          firebase.firestore.FieldValue
            .serverTimestamp()

      });


      await db.runTransaction(
        async transaction => {

          const targetSnap =
            await transaction.get(
              targetUserRef
            );

          const currentSnap =
            await transaction.get(
              currentUserRef
            );

          const targetData =
            targetSnap.exists
              ? targetSnap.data()
              : {};

          const currentData =
            currentSnap.exists
              ? currentSnap.data()
              : {};

          transaction.update(
            targetUserRef,
            {
              followers:
                Number(
                  targetData.followers || 0
                ) + 1
            }
          );

          transaction.update(
            currentUserRef,
            {
              following:
                Number(
                  currentData.following || 0
                ) + 1
            }
          );

        }
      );


      if(
        !state.following.includes(
          targetUid
        )
      ){

        state.following.push(
          targetUid
        );

      }

      toast(
        'Following ✓'
      );

    }


    await loadFirebaseUser();

    saveLocal();

    hideLoading();

    render();


  }catch(error){

    console.error(
      'Follow error:',
      error
    );

    hideLoading();

    toast(
      'Follow नहीं हो पाया'
    );

  }

}

async function saveProfile(){

  if(!currentUser)
    return;

  const name =
    document
      .getElementById('editName')
      ?.value
      .trim() ||
    state.user.name;

  let handle =
    document
      .getElementById('editHandle')
      ?.value
      .trim() ||
    state.user.handle;

  const bio =
    document
      .getElementById('editBio')
      ?.value
      .trim() ||
    '';


  if(!handle.startsWith('@'))
    handle = '@' + handle;


  const initial =
    name
      .charAt(0)
      .toUpperCase();


  try{

    showLoading(
      'Profile save हो रही है...'
    );


    await db
      .collection('users')
      .doc(currentUser.uid)
      .update({

        name:name,

        handle:handle,

        initial:initial,

        bio:bio

      });


    state.user.name =
      name;

    state.user.handle =
      handle;

    state.user.initial =
      initial;

    state.user.bio =
      bio;


    saveLocal();

    await loadFirebasePosts();

    render();

    hideLoading();

    openProfile();

    toast(
      'Profile updated ✓'
    );


  }catch(error){

    console.error(error);

    hideLoading();

    toast(
      'Profile update नहीं हुआ'
    );

  }

}
